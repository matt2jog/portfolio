name: UI Tests

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  ui:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run check

      - name: Run UI assertions
        run: npm run test:ui

      - name: Generate viewport screenshots
        run: npm run test:ui-pictures

      - name: Verify viewport screenshots
        run: npm run test:ui-pictures:verify

      - name: Upload viewport screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: viewport-human-judge
          path: |
            src/tests/viewport-human-judge/desktop
            src/tests/viewport-human-judge/mobile
          if-no-files-found: warn
