# Root workflow-template handoff: root must provision the exact WIF provider
# and regenerate this service-owned workflow before release.
name: Build Approved Release Image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: portfolio-release-image-${{ github.sha }}
  cancel-in-progress: false

env:
  NODE_ENV: production
  GCP_PROJECT_ID: personal-brand-501801
  IMAGE_REPOSITORY: us-east4-docker.pkg.dev/personal-brand-501801/portfolio/portfolio
  WIF_PROVIDER: projects/601853536613/locations/global/workloadIdentityPools/personal-brand-github/providers/portfolio-release-image-main
  RELEASE_IMAGE_SERVICE_ACCOUNT: portfolio-release-image@personal-brand-501801.iam.gserviceaccount.com

jobs:
  approve_image:
    if: github.repository == 'matt2jog/portfolio' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out exact main commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
      - name: Install and verify source
        run: |
          npm ci --include=dev
          npm run lint
          npm run check
          npm run test:coverage
          npm run build
      - name: Authenticate exact workflow-bound image publisher
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.RELEASE_IMAGE_SERVICE_ACCOUNT }}
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
      - name: Build immutable merge-SHA image once
        run: docker build --pull --build-arg "VCS_REF=${GITHUB_SHA}" --tag "${IMAGE_REPOSITORY}:${GITHUB_SHA}" .
      - name: Report High vulnerabilities and misconfiguration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE_REPOSITORY }}:${{ github.sha }}
          scanners: vuln,misconfig
          severity: HIGH
          format: table
          exit-code: "0"
      - name: Block Critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE_REPOSITORY }}:${{ github.sha }}
          scanners: vuln
          severity: CRITICAL
          format: table
          exit-code: "1"
          skip-setup-trivy: true
      - name: Block detected secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE_REPOSITORY }}:${{ github.sha }}
          scanners: secret
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          format: table
          exit-code: "1"
          skip-setup-trivy: true
      - name: Push and bind the one approved digest
        env:
          RECORD_FILE: ${{ runner.temp }}/portfolio-release-image.json
        run: |
          set -euo pipefail
          gcloud auth configure-docker us-east4-docker.pkg.dev --quiet
          docker push "${IMAGE_REPOSITORY}:${GITHUB_SHA}"
          digest="$(gcloud artifacts docker images describe "${IMAGE_REPOSITORY}:${GITHUB_SHA}" --project "$GCP_PROJECT_ID" --format='value(image_summary.digest)')"
          image_uri="${IMAGE_REPOSITORY}@${digest}"
          docker pull "$image_uri"
          npx tsx src/scripts/release/image-provenance.ts "$image_uri" "$GITHUB_SHA"
          npx tsx src/scripts/release/release-image-record.ts create "$GITHUB_SHA" "$image_uri" "$GITHUB_RUN_ID" >"$RECORD_FILE"
      - name: Retain immutable image handoff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: portfolio-release-image-${{ github.sha }}
          path: ${{ runner.temp }}/portfolio-release-image.json
          if-no-files-found: error
          retention-days: 90
