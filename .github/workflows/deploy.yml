name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: portfolio-production
  cancel-in-progress: false

env:
  NODE_ENV: production
  GCP_PROJECT_ID: personal-brand-501801
  GCP_PROJECT_NUMBER: "601853536613"
  GCP_REGION: us-east4
  IMAGE_REPOSITORY: us-east4-docker.pkg.dev/personal-brand-501801/portfolio/portfolio
  DEPLOYMENT_SECRET_NAME: portfolio-deployment-bundle-prod
  RUNTIME_SECRET_NAME: portfolio-runtime-bundle-prod
  DEPLOYMENT_BUNDLE_VERSION: ${{ vars.PORTFOLIO_DEPLOYMENT_BUNDLE_VERSION }}
  RUNTIME_BUNDLE_VERSION: ${{ vars.PORTFOLIO_RUNTIME_BUNDLE_VERSION }}
  SERVICE_NAME: portfolio--prod
  WIF_PROVIDER: projects/601853536613/locations/global/workloadIdentityPools/personal-brand-github/providers/portfolio-main
  DEPLOY_SERVICE_ACCOUNT: portfolio-deploy@personal-brand-501801.iam.gserviceaccount.com
  RUNTIME_SERVICE_ACCOUNT: portfolio-runtime@personal-brand-501801.iam.gserviceaccount.com
  CLOUDFLARE_ACCOUNT_ID: c73b9d28e6312e1b73119c616103fb21
  CLOUDFLARE_ZONE_ID: fa994604e846dbdfe1f8f90758677b92
  PORTFOLIO_CUTOVER_EVIDENCE_RUN_ID: ${{ vars.PORTFOLIO_CUTOVER_EVIDENCE_RUN_ID }}
  PORTFOLIO_CUTOVER_EVIDENCE_SHA256: ${{ vars.PORTFOLIO_CUTOVER_EVIDENCE_SHA256 }}
  PORTFOLIO_AUTHORITY_PHASE: private-irreversible
  PORTFOLIO_PREVIOUS_REVISION_COMPATIBILITY: ${{ vars.PORTFOLIO_PREVIOUS_REVISION_COMPATIBILITY }}
  PORTFOLIO_PUBLIC_ONLY_BASELINE_IMAGE_DIGEST: ${{ vars.PORTFOLIO_PUBLIC_ONLY_BASELINE_IMAGE_DIGEST }}
  PORTFOLIO_PRIVATE_COMPATIBLE_PREVIOUS_DIGEST: ${{ vars.PORTFOLIO_PRIVATE_COMPATIBLE_PREVIOUS_DIGEST }}
  PORTFOLIO_PUBSUB_CONFIGURATION_GENERATION: ${{ vars.PORTFOLIO_PUBSUB_CONFIGURATION_GENERATION }}
  LEGAL_AUDIT_BUNDLE_VERSION: ${{ vars.PORTFOLIO_LEGAL_AUDIT_BUNDLE_VERSION }}
  GITHUB_WORKFLOW_SHA: ${{ github.sha }}

jobs:
  legal_audit:
    if: github.repository == 'matt2jog/portfolio' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/legal-audit.yml
    with:
      source_sha: ${{ github.sha }}
      identity_mode: reusable

  prepare_release:
    needs: legal_audit
    if: github.repository == 'matt2jog/portfolio' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: production
    outputs:
      image_digest: ${{ steps.image.outputs.digest }}
      image_digest_uri: ${{ steps.image.outputs.uri }}
      migration_ledger_digest: ${{ steps.evidence.outputs.migration_ledger_digest }}
      cutover_evidence_sha256: ${{ steps.evidence.outputs.cutover_evidence_sha256 }}

    steps:
      - name: Check out merge commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: |
          npm ci --include=dev
          npm --prefix infra/cloudflare/portfolio-edge ci --include=dev

      - name: Verify source
        run: |
          npm run lint
          npm run check
          npm run test:coverage
          npm run test:client-coverage
          npm --prefix infra/cloudflare/portfolio-edge run test:coverage
          npm --prefix infra/cloudflare/portfolio-edge run check

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run UI tests
        run: npm run test:ui

      - name: Build application
        run: npm run build

      - name: Authenticate through repository-bound WIF
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Validate exact secret bundle versions
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RUNTIME_BUNDLE_VERSION" =~ ^[1-9][0-9]*$ ]]
          [[ "$DEPLOYMENT_BUNDLE_VERSION" =~ ^[1-9][0-9]*$ ]]
          runtime_state="$(gcloud secrets versions describe "$RUNTIME_BUNDLE_VERSION" --secret "$RUNTIME_SECRET_NAME" --project "$GCP_PROJECT_ID" --format='value(state)')"
          test "$runtime_state" = "ENABLED"
          bundle_file="${RUNNER_TEMP}/portfolio-deployment-bundle.json"
          install -m 600 /dev/null "$bundle_file"
          gcloud secrets versions access "$DEPLOYMENT_BUNDLE_VERSION" --secret "$DEPLOYMENT_SECRET_NAME" --project "$GCP_PROJECT_ID" > "$bundle_file"
          npx tsx src/scripts/release/validate-deployment-bundle.ts "$bundle_file"

      - name: Preflight production dependencies
        shell: bash
        run: |
          set -euo pipefail
          bundle_file="${RUNNER_TEMP}/portfolio-deployment-bundle.json"
          install -m 600 /dev/null "$bundle_file"
          gcloud secrets versions access "$DEPLOYMENT_BUNDLE_VERSION" --secret "$DEPLOYMENT_SECRET_NAME" --project "$GCP_PROJECT_ID" > "$bundle_file"
          npx tsx src/scripts/release/run-deployment-command.ts "$bundle_file" -- bash .github/scripts/preflight-release.sh

      - name: Build immutable merge-SHA image
        env:
          IMAGE_URI: ${{ env.IMAGE_REPOSITORY }}:${{ github.sha }}
        run: docker build --pull --build-arg "VCS_REF=${GITHUB_SHA}" --tag "$IMAGE_URI" .

      - name: Report High vulnerabilities and misconfiguration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE_REPOSITORY }}:${{ github.sha }}
          scanners: vuln,misconfig
          severity: HIGH
          format: table
          exit-code: "0"

      - name: Block Critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE_REPOSITORY }}:${{ github.sha }}
          scanners: vuln
          severity: CRITICAL
          format: table
          exit-code: "1"
          skip-setup-trivy: true

      - name: Block detected secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE_REPOSITORY }}:${{ github.sha }}
          scanners: secret
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          format: table
          exit-code: "1"
          skip-setup-trivy: true

      - name: Authenticate Docker to dedicated Artifact Registry
        run: gcloud auth configure-docker us-east4-docker.pkg.dev --quiet

      - name: Push scanned image and resolve registry digest
        id: image
        env:
          IMAGE_URI: ${{ env.IMAGE_REPOSITORY }}:${{ github.sha }}
        run: |
          set -euo pipefail
          docker push "$IMAGE_URI"
          IMAGE_DIGEST="$(gcloud artifacts docker images describe "$IMAGE_URI" --project "$GCP_PROJECT_ID" --format='value(image_summary.digest)')"
          test -n "$IMAGE_DIGEST"
          IMAGE_DIGEST_URI="${IMAGE_REPOSITORY}@${IMAGE_DIGEST}"
          docker pull "$IMAGE_DIGEST_URI"
          npx tsx src/scripts/release/image-provenance.ts "$IMAGE_DIGEST_URI" "$GITHUB_SHA"
          echo "digest=${IMAGE_DIGEST}" >> "$GITHUB_OUTPUT"
          echo "uri=${IMAGE_DIGEST_URI}" >> "$GITHUB_OUTPUT"

      - name: Prove the serving revision is migration-compatible
        shell: bash
        run: |
          set -euo pipefail
          service_json="$(gcloud run services describe "$SERVICE_NAME" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json)"
          previous_revision="$(jq -er '[.status.traffic[] | select(.percent == 100) | .revisionName] | if length == 1 then .[0] else error("expected one serving revision") end' <<<"$service_json")"
          previous_digest="$(gcloud run revisions describe "$previous_revision" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format='value(status.imageDigest)')"
          case "$PORTFOLIO_PREVIOUS_REVISION_COMPATIBILITY" in
            public-only)
              [[ "$PORTFOLIO_PUBLIC_ONLY_BASELINE_IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
              test "$previous_digest" = "$PORTFOLIO_PUBLIC_ONLY_BASELINE_IMAGE_DIGEST"
              ;;
            private-compatible)
              [[ "$PORTFOLIO_PRIVATE_COMPATIBLE_PREVIOUS_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
              test "$previous_digest" = "$PORTFOLIO_PRIVATE_COMPATIBLE_PREVIOUS_DIGEST"
              ;;
            *)
              echo "Previous revision compatibility must be public-only or private-compatible." >&2
              exit 2
              ;;
          esac

      - name: Consume exact finalized cutover evidence
        id: evidence
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PORTFOLIO_CUTOVER_EVIDENCE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$PORTFOLIO_CUTOVER_EVIDENCE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PORTFOLIO_CUTOVER_EVIDENCE_RUN_ID}")"
          jq -e --arg sha "$GITHUB_SHA" '
            .event == "workflow_dispatch" and .head_sha == $sha and .status == "completed" and
            .conclusion == "success" and .path == ".github/workflows/data-migration.yml"
          ' <<<"$run_json" >/dev/null
          artifacts_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PORTFOLIO_CUTOVER_EVIDENCE_RUN_ID}/artifacts?per_page=100")"
          artifact_id="$(jq -er --arg run "$PORTFOLIO_CUTOVER_EVIDENCE_RUN_ID" --arg digest "$PORTFOLIO_CUTOVER_EVIDENCE_SHA256" '
            [.artifacts[] | select(.expired == false and (.name | startswith("portfolio-data-migration-evidence-" + $run + "-")) and (.name | endswith("-" + $digest)))] |
            if length == 1 then .[0].id else error("expected exactly one digest-bound evidence artifact") end
          ' <<<"$artifacts_json")"
          evidence_zip="${RUNNER_TEMP}/portfolio-cutover-evidence.zip"
          evidence_dir="${RUNNER_TEMP}/portfolio-cutover-evidence"
          mkdir -p "$evidence_dir"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > "$evidence_zip"
          test "$(unzip -Z1 "$evidence_zip" | wc -l)" -eq 1
          test "$(unzip -Z1 "$evidence_zip")" = "portfolio-data-migration-evidence.json"
          unzip -q "$evidence_zip" -d "$evidence_dir"
          migration_ledger_digest="$(npx tsx src/scripts/release/migration-plan-digest.ts src/migrations)"
          npx tsx src/scripts/release/validate-cutover-evidence.ts \
            "$evidence_dir/portfolio-data-migration-evidence.json" \
            "$IMAGE_DIGEST" "$PORTFOLIO_CUTOVER_EVIDENCE_SHA256" "$migration_ledger_digest"
          echo "migration_ledger_digest=${migration_ledger_digest}" >> "$GITHUB_OUTPUT"
          echo "cutover_evidence_sha256=${PORTFOLIO_CUTOVER_EVIDENCE_SHA256}" >> "$GITHUB_OUTPUT"

      - name: Run pre-role bootstrap, migrations, and exact post-ACL reconciliation after legal and cutover gates
        env:
          IMAGE_DIGEST_URI: ${{ steps.image.outputs.uri }}
        shell: bash
        run: |
          set -euo pipefail
          bundle_file="${RUNNER_TEMP}/portfolio-deployment-bundle.json"
          install -m 600 /dev/null "$bundle_file"
          gcloud secrets versions access "$DEPLOYMENT_BUNDLE_VERSION" --secret "$DEPLOYMENT_SECRET_NAME" --project "$GCP_PROJECT_ID" > "$bundle_file"
          npx tsx src/scripts/release/run-database-release-from-bundle.ts "$bundle_file" "$IMAGE_DIGEST_URI"

      - name: Remove ephemeral deployment bundle
        if: always()
        run: rm -f "${RUNNER_TEMP}/portfolio-deployment-bundle.json"
  release:
    needs: prepare_release
    if: github.repository == 'matt2jog/portfolio' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    steps:
      - name: Check out exact release commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked release tooling
        run: |
          npm ci --include=dev
          npm --prefix infra/cloudflare/portfolio-edge ci --include=dev

      - name: Authenticate through repository-bound WIF
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Deploy private-authority candidate and record exact release state
        env:
          GITHUB_SHA: ${{ github.sha }}
          IMAGE_DIGEST: ${{ needs.prepare_release.outputs.image_digest }}
          IMAGE_DIGEST_URI: ${{ needs.prepare_release.outputs.image_digest_uri }}
          PORTFOLIO_MIGRATION_LEDGER_DIGEST: ${{ needs.prepare_release.outputs.migration_ledger_digest }}
          PORTFOLIO_CUTOVER_EVIDENCE_SHA256: ${{ needs.prepare_release.outputs.cutover_evidence_sha256 }}
          RELEASE_RECORD_FILE: ${{ runner.temp }}/portfolio-release-record.json
        shell: bash
        run: |
          set -euo pipefail
          test "$PORTFOLIO_AUTHORITY_PHASE" = "private-irreversible"
          [[ "$RUNTIME_BUNDLE_VERSION" =~ ^[1-9][0-9]*$ ]]
          [[ "$DEPLOYMENT_BUNDLE_VERSION" =~ ^[1-9][0-9]*$ ]]
          [[ "$LEGAL_AUDIT_BUNDLE_VERSION" =~ ^[1-9][0-9]*$ ]]
          [[ "$PORTFOLIO_PUBSUB_CONFIGURATION_GENERATION" =~ ^[1-9][0-9]*$ ]]
          bundle_file="${RUNNER_TEMP}/portfolio-deployment-bundle.json"
          install -m 600 /dev/null "$bundle_file"
          gcloud secrets versions access "$DEPLOYMENT_BUNDLE_VERSION" --secret "$DEPLOYMENT_SECRET_NAME" --project "$GCP_PROJECT_ID" > "$bundle_file"
          npx tsx src/scripts/release/run-deployment-command.ts "$bundle_file" -- bash .github/scripts/deploy-cloud-run.sh

      - name: Register the observed successful release and grace-gate audit contraction
        env:
          IMAGE_DIGEST: ${{ needs.prepare_release.outputs.image_digest }}
        shell: bash
        run: |
          set -euo pipefail
          bundle_file="${RUNNER_TEMP}/portfolio-deployment-bundle.json"
          install -m 600 /dev/null "$bundle_file"
          gcloud secrets versions access "$DEPLOYMENT_BUNDLE_VERSION" --secret "$DEPLOYMENT_SECRET_NAME" --project "$GCP_PROJECT_ID" > "$bundle_file"
          npx tsx src/scripts/release/record-audit-release-from-bundle.ts "$bundle_file" "$GITHUB_SHA" "$IMAGE_DIGEST"

      - name: Retain exact release and rollback state
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: portfolio-release-record-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/portfolio-release-record.json
            ${{ runner.temp }}/portfolio-edge-rollback-state.json
            ${{ runner.temp }}/portfolio-cloud-run-rollback-state.json
          if-no-files-found: error
          retention-days: 30

      - name: Remove ephemeral deployment bundle
        if: always()
        run: rm -f "${RUNNER_TEMP}/portfolio-deployment-bundle.json"
