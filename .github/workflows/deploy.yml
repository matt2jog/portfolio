# Portfolio-owned manual-promotion pilot.
# This workflow prepares and publishes a zero-traffic candidate. It never promotes traffic.
name: Prepare production candidate

on:
  workflow_dispatch:
    inputs:
      image_build_run_id:
        description: Successful Build Approved Release Image run for the current main commit
        required: false
        default: ""
        type: string
      application_release_sha:
        description: Approved image commit; may trail main only by delivery or test changes
        required: false
        default: ""
        type: string
      candidate_run_id:
        description: Failed candidate run whose successful deployment should only be republished
        required: false
        default: ""
        type: string

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: portfolio-production-candidate
  cancel-in-progress: false

env:
  NODE_ENV: production
  GCP_PROJECT_ID: personal-brand-501801
  GCP_REGION: us-east4
  IMAGE_REPOSITORY: us-east4-docker.pkg.dev/personal-brand-501801/portfolio/portfolio
  DEPLOYMENT_SECRET_NAME: portfolio-deployment-bundle-prod
  RUNTIME_SECRET_NAME: portfolio-runtime-bundle-prod
  DEPLOYMENT_BUNDLE_VERSION: ${{ vars.PORTFOLIO_DEPLOYMENT_BUNDLE_VERSION }}
  RUNTIME_BUNDLE_VERSION: ${{ vars.PORTFOLIO_RUNTIME_BUNDLE_VERSION }}
  SERVICE_NAME: portfolio--prod
  WIF_PROVIDER: projects/601853536613/locations/global/workloadIdentityPools/personal-brand-github/providers/portfolio-main
  DEPLOY_SERVICE_ACCOUNT: portfolio-deploy@personal-brand-501801.iam.gserviceaccount.com
  RUNTIME_SERVICE_ACCOUNT: portfolio-runtime@personal-brand-501801.iam.gserviceaccount.com
  RELEASE_CONTROLLER_URL: https://release-controller-hqojlnvxwa-uk.a.run.app
  GITHUB_WORKFLOW_SHA: ${{ github.sha }}
  APPLICATION_RELEASE_SHA: ${{ inputs.application_release_sha || github.sha }}
  IMAGE_RELEASE_RUN_ID: ${{ inputs.image_build_run_id }}

jobs:
  legal_audit:
    if: github.repository == 'matt2jog/portfolio' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.candidate_run_id == ''
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/legal-audit.yml
    with:
      source_sha: ${{ github.sha }}
      identity_mode: reusable

  candidate:
    needs: legal_audit
    if: github.repository == 'matt2jog/portfolio' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.candidate_run_id == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: production

    steps:
      - name: Check out exact main commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked release tooling
        run: npm ci --include=dev

      - name: Authenticate through repository-bound WIF
        id: google_auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: ${{ env.RELEASE_CONTROLLER_URL }}
          id_token_include_email: true

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Validate exact secret bundle versions
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RUNTIME_BUNDLE_VERSION" =~ ^[1-9][0-9]*$ ]]
          [[ "$DEPLOYMENT_BUNDLE_VERSION" =~ ^[1-9][0-9]*$ ]]
          runtime_state="$(gcloud secrets versions describe "$RUNTIME_BUNDLE_VERSION" \
            --secret "$RUNTIME_SECRET_NAME" --project "$GCP_PROJECT_ID" \
            --format='value(state)')"
          deployment_state="$(gcloud secrets versions describe "$DEPLOYMENT_BUNDLE_VERSION" \
            --secret "$DEPLOYMENT_SECRET_NAME" --project "$GCP_PROJECT_ID" \
            --format='value(state)')"
          test "$runtime_state" = "ENABLED"
          test "$deployment_state" = "ENABLED"
          bundle_file="${RUNNER_TEMP}/portfolio-deployment-bundle.json"
          install -m 600 /dev/null "$bundle_file"
          gcloud secrets versions access "$DEPLOYMENT_BUNDLE_VERSION" \
            --secret "$DEPLOYMENT_SECRET_NAME" --project "$GCP_PROJECT_ID" >"$bundle_file"
          npx tsx src/scripts/release/validate-deployment-bundle.ts "$bundle_file"

      - name: Consume the one approved immutable image handoff
        id: image
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$IMAGE_RELEASE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          bash .github/scripts/verify-approved-image-reuse.sh \
            "$APPLICATION_RELEASE_SHA" "$GITHUB_SHA"
          record_file="${RUNNER_TEMP}/portfolio-release-image.json"
          image_digest_uri="$(bash .github/scripts/fetch-release-image.sh "$IMAGE_RELEASE_RUN_ID" "$APPLICATION_RELEASE_SHA" "$record_file")"
          gcloud auth configure-docker us-east4-docker.pkg.dev --quiet
          docker pull "$image_digest_uri"
          npx tsx src/scripts/release/image-provenance.ts "$image_digest_uri" "$APPLICATION_RELEASE_SHA"
          image_digest="${image_digest_uri##*@}"
          [[ "$image_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=${image_digest}" >>"$GITHUB_OUTPUT"
          echo "uri=${image_digest_uri}" >>"$GITHUB_OUTPUT"

      - name: Run additive migrations using the approved image
        id: migrations
        env:
          IMAGE_DIGEST_URI: ${{ steps.image.outputs.uri }}
          MIGRATION_EVIDENCE_FILE: ${{ runner.temp }}/portfolio-migration-evidence.json
        shell: bash
        run: |
          set -euo pipefail
          migration_ledger_digest="$(npx tsx \
            src/scripts/release/migration-plan-digest.ts src/migrations)"
          [[ "$migration_ledger_digest" =~ ^[0-9a-f]{64}$ ]]
          bundle_file="${RUNNER_TEMP}/portfolio-deployment-bundle.json"
          install -m 600 /dev/null "$bundle_file"
          gcloud secrets versions access "$DEPLOYMENT_BUNDLE_VERSION" \
            --secret "$DEPLOYMENT_SECRET_NAME" --project "$GCP_PROJECT_ID" >"$bundle_file"
          npx tsx src/scripts/release/run-database-release-from-bundle.ts \
            "$bundle_file" "$IMAGE_DIGEST_URI" "$APPLICATION_RELEASE_SHA"
          jq -S -n \
            --arg releaseSha "$APPLICATION_RELEASE_SHA" \
            --arg imageDigestUri "$IMAGE_DIGEST_URI" \
            --arg migrationLedgerDigest "$migration_ledger_digest" \
            --arg completedAt "$(date -u +'%Y-%m-%dT%H:%M:%S.000Z')" \
            '{
              schemaVersion: 1,
              serviceId: "portfolio",
              releaseSha: $releaseSha,
              imageDigestUri: $imageDigestUri,
              migrationLedgerDigest: $migrationLedgerDigest,
              status: "passed",
              completedAt: $completedAt
            }' >"$MIGRATION_EVIDENCE_FILE"
          evidence_sha256="$(sha256sum "$MIGRATION_EVIDENCE_FILE" | awk '{print $1}')"
          [[ "$evidence_sha256" =~ ^[0-9a-f]{64}$ ]]
          echo "evidence_sha256=${evidence_sha256}" >>"$GITHUB_OUTPUT"

      - name: Deploy and smoke-test green at zero traffic
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          IMAGE_DIGEST_URI: ${{ steps.image.outputs.uri }}
          MIGRATION_EVIDENCE_SHA256: ${{ steps.migrations.outputs.evidence_sha256 }}
          CANDIDATE_MANIFEST_FILE: ${{ runner.temp }}/portfolio-candidate-manifest.json
          CANDIDATE_SMOKE_FILE: ${{ runner.temp }}/portfolio-candidate-smoke.json
          CLOUD_RUN_ROLLBACK_STATE_FILE: ${{ runner.temp }}/portfolio-cloud-run-rollback-state.json
        shell: bash
        run: |
          set -euo pipefail
          bundle_file="${RUNNER_TEMP}/portfolio-deployment-bundle.json"
          install -m 600 /dev/null "$bundle_file"
          gcloud secrets versions access "$DEPLOYMENT_BUNDLE_VERSION" \
            --secret "$DEPLOYMENT_SECRET_NAME" --project "$GCP_PROJECT_ID" >"$bundle_file"
          npx tsx src/scripts/release/run-deployment-command.ts \
            "$bundle_file" -- bash .github/scripts/deploy-candidate.sh

      - name: Publish identity-attested candidate to release controller
        env:
          CANDIDATE_MANIFEST_FILE: ${{ runner.temp }}/portfolio-candidate-manifest.json
          CONTROLLER_RESPONSE_FILE: ${{ runner.temp }}/portfolio-controller-response.json
          CONTROLLER_ID_TOKEN: ${{ steps.google_auth.outputs.id_token }}
          EXPECTED_CANDIDATE_SHA: ${{ env.APPLICATION_RELEASE_SHA }}
        shell: bash
        run: bash .github/scripts/publish-candidate.sh

      - name: Retain candidate handoff evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: portfolio-candidate-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/portfolio-release-image.json
            ${{ runner.temp }}/portfolio-migration-evidence.json
            ${{ runner.temp }}/portfolio-candidate-smoke.json
            ${{ runner.temp }}/portfolio-candidate-manifest.json
            ${{ runner.temp }}/portfolio-controller-response.json
            ${{ runner.temp }}/portfolio-cloud-run-rollback-state.json
          if-no-files-found: warn
          retention-days: 30

      - name: Remove ephemeral credentials
        if: always()
        shell: bash
        run: |
          rm -f \
            "${RUNNER_TEMP}/portfolio-deployment-bundle.json" \
            "${RUNNER_TEMP}/portfolio-database-bootstrap-bundle.json"

  publish_existing_candidate:
    if: github.repository == 'matt2jog/portfolio' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.candidate_run_id != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production

    steps:
      - name: Check out publication recovery logic
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Authenticate publisher and mint controller identity
        id: google_auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: ${{ env.RELEASE_CONTROLLER_URL }}
          id_token_include_email: true

      - name: Verify failed publication handoff without redeploying
        id: handoff
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          bash .github/scripts/fetch-candidate-handoff.sh \
            "${{ inputs.candidate_run_id }}" \
            "${RUNNER_TEMP}/portfolio-candidate-recovery"

      - name: Publish the verified existing candidate
        env:
          CANDIDATE_MANIFEST_FILE: ${{ steps.handoff.outputs.manifest_file }}
          CONTROLLER_RESPONSE_FILE: ${{ runner.temp }}/portfolio-controller-response.json
          CONTROLLER_ID_TOKEN: ${{ steps.google_auth.outputs.id_token }}
          EXPECTED_CANDIDATE_SHA: ${{ steps.handoff.outputs.candidate_sha }}
        shell: bash
        run: bash .github/scripts/publish-candidate.sh

      - name: Retain recovery publication evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: portfolio-candidate-publication-${{ inputs.candidate_run_id }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/portfolio-candidate-recovery/portfolio-candidate-manifest.json
            ${{ runner.temp }}/portfolio-controller-response.json
          if-no-files-found: warn
          retention-days: 30
