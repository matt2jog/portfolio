name: Cleanup Retained Portfolio Release

on:
  workflow_dispatch:
    inputs:
      prior_release_run_id:
        description: Workflow run containing the eligible older release record
        required: true
        type: string
      current_release_run_id:
        description: Workflow run containing the current successful release record
        required: true
        type: string
      confirmation:
        description: Enter CLEANUP_RETAINED_PORTFOLIO_RELEASE
        required: true
        type: string

permissions:
  actions: write
  contents: read
  id-token: write

concurrency:
  group: portfolio-production
  cancel-in-progress: false

env:
  NODE_ENV: production
  GITHUB_WORKFLOW_SHA: ${{ github.sha }}
  GCP_PROJECT_ID: personal-brand-501801
  GCP_REGION: us-east4
  SERVICE_NAME: portfolio--prod
  CLOUDFLARE_ACCOUNT_ID: c73b9d28e6312e1b73119c616103fb21
  DEPLOYMENT_SECRET_NAME: portfolio-deployment-bundle-prod
  DEPLOYMENT_BUNDLE_VERSION: ${{ vars.PORTFOLIO_DEPLOYMENT_BUNDLE_VERSION }}
  WIF_PROVIDER: projects/601853536613/locations/global/workloadIdentityPools/personal-brand-github/providers/portfolio-release-cleanup-main
  DEPLOY_SERVICE_ACCOUNT: portfolio-release-cleanup@personal-brand-501801.iam.gserviceaccount.com

jobs:
  legal_audit:
    if: github.repository == 'matt2jog/portfolio' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/legal-audit.yml
    with:
      source_sha: ${{ github.sha }}
      identity_mode: release_cleanup

  cleanup:
    needs: legal_audit
    if: github.repository == 'matt2jog/portfolio' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    env:
      PRIOR_RUN_ID: ${{ inputs.prior_release_run_id }}
      CURRENT_RUN_ID: ${{ inputs.current_release_run_id }}
      CONFIRMATION: ${{ inputs.confirmation }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out exact cleanup source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked cleanup tooling
        run: npm ci --include=dev

      - name: Validate request and fetch exact release records
        id: records
        shell: bash
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = "CLEANUP_RETAINED_PORTFOLIO_RELEASE"
          [[ "$PRIOR_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$CURRENT_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          test "$PRIOR_RUN_ID" != "$CURRENT_RUN_ID"
          for kind in prior current; do
            run_variable="${kind^^}_RUN_ID"
            run_id="${!run_variable}"
            run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}")"
            jq -e '.status == "completed" and .conclusion == "success" and .path == ".github/workflows/deploy.yml"' <<<"$run_json" >/dev/null
            artifacts="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts?per_page=100")"
            artifact_id="$(jq -er '[.artifacts[] | select(.expired == false and (.name | startswith("portfolio-release-record-")))] | if length == 1 then .[0].id else error("expected one retained release artifact") end' <<<"$artifacts")"
            destination="${RUNNER_TEMP}/${kind}"
            mkdir -p "$destination"
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" >"${destination}.zip"
            unzip -q "${destination}.zip" -d "$destination"
            record="$(find "$destination" -type f -name portfolio-release-record.json -print -quit)"
            test -n "$record"
            cp "$record" "${RUNNER_TEMP}/${kind}-release-record.json"
            echo "${kind}_artifact_id=${artifact_id}" >> "$GITHUB_OUTPUT"
          done
          npx tsx src/scripts/release/release-cleanup.ts \
            "${RUNNER_TEMP}/prior-release-record.json" \
            "${RUNNER_TEMP}/current-release-record.json" >/dev/null

      - name: Authenticate through repository-bound WIF
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Cleanup exact eligible Cloud Run, edge, and origin-token rollback state
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DEPLOYMENT_BUNDLE_VERSION" =~ ^[1-9][0-9]*$ ]]
          bundle_file="${RUNNER_TEMP}/portfolio-deployment-bundle.json"
          install -m 600 /dev/null "$bundle_file"
          gcloud secrets versions access "$DEPLOYMENT_BUNDLE_VERSION" --secret "$DEPLOYMENT_SECRET_NAME" --project "$GCP_PROJECT_ID" > "$bundle_file"
          npx tsx src/scripts/release/run-deployment-command.ts "$bundle_file" -- \
            bash .github/scripts/cleanup-release-state.sh \
            "${RUNNER_TEMP}/prior-release-record.json" \
            "${RUNNER_TEMP}/current-release-record.json"

      - name: Delete only the cleaned retained artifact
        run: gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${{ steps.records.outputs.prior_artifact_id }}"

      - name: Remove ephemeral cleanup material
        if: always()
        run: rm -rf "${RUNNER_TEMP}/portfolio-deployment-bundle.json" "${RUNNER_TEMP}/prior" "${RUNNER_TEMP}/current" "${RUNNER_TEMP}/prior.zip" "${RUNNER_TEMP}/current.zip" "${RUNNER_TEMP}/prior-release-record.json" "${RUNNER_TEMP}/current-release-record.json"
