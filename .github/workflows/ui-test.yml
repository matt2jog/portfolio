name: UI Test

# Lint, type-check, and run functional Playwright assertions.

on:
  pull_request:
  push:
    branches:
      - main
      - prod
  workflow_dispatch:

jobs:
  ui-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run check

      - name: Run UI assertions
        run: npm run test:ui
