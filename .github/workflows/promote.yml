name: Promote staged image

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: portfolio-production
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: personal-brand-501801
  GCP_REGION: us-east4
  IMAGE_URI: us-east4-docker.pkg.dev/personal-brand-501801/portfolio/portfolio
  STAGING_SERVICE: portfolio--staging
  PROD_SERVICE: portfolio--prod
  PROD_MIGRATION_JOB: portfolio-migrate--prod
  PROD_E2E_BASE_URL: https://2jog.dev
  PROD_HOST: 2jog.dev
  WIF_PROVIDER: projects/601853536613/locations/global/workloadIdentityPools/github-actions/providers/github-actions
  DEPLOY_SERVICE_ACCOUNT: portfolio-deploy@personal-brand-501801.iam.gserviceaccount.com

jobs:
  promote:
    name: Promote healthy staging digest
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: production
    steps:
      - name: Check out full history
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require main dispatch
        run: |
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "::error::Production promotion must be dispatched from main."
            exit 1
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Discover and verify healthy staging release
        id: staged
        shell: bash
        run: |
          set -euo pipefail
          service_json="$(gcloud run services describe "${STAGING_SERVICE}" \
            --project "${GCP_PROJECT_ID}" \
            --region "${GCP_REGION}" \
            --format=json)"
          [[ "$(jq -r '.status.conditions[] | select(.type == "Ready") | .status' <<<"${service_json}")" == "True" ]]
          [[ "$(jq '[.status.traffic[] | select(.percent == 100 and .revisionName != null)] | length' \
            <<<"${service_json}")" == "1" ]]
          staging_revision="$(jq -er '.status.traffic[] | select(.percent == 100 and .revisionName != null) | .revisionName' \
            <<<"${service_json}")"
          commit_sha="$(jq -er '.metadata.labels["commit-sha"]' <<<"${service_json}")"
          [[ "${commit_sha}" =~ ^[0-9a-f]{40}$ ]]
          digest_uri="$(gcloud run revisions describe "${staging_revision}" \
            --project "${GCP_PROJECT_ID}" \
            --region "${GCP_REGION}" \
            --format='value(spec.containers[0].image)')"
          [[ "${digest_uri}" == "${IMAGE_URI}@sha256:"* ]]
          staging_url="$(jq -er '.status.url' <<<"${service_json}")"
          staging_health="$(curl --fail --silent --show-error --retry 5 --retry-all-errors \
            --retry-delay 2 "${staging_url}/health")"
          [[ "$(jq -r '.release_sha' <<<"${staging_health}")" == "${commit_sha}" ]]
          digest="${digest_uri##*@}"
          tagged_digest="$(gcloud artifacts docker images describe "${IMAGE_URI}:${commit_sha}" \
            --project "${GCP_PROJECT_ID}" \
            --format='value(image_summary.digest)')"
          [[ "${tagged_digest}" == "${digest}" ]]
          git merge-base --is-ancestor "${commit_sha}" HEAD
          echo "digest_uri=${digest_uri}" >> "${GITHUB_OUTPUT}"
          echo "commit_sha=${commit_sha}" >> "${GITHUB_OUTPUT}"

      - name: Migrate, smoke, shift traffic, and retain rollback
        shell: bash
        env:
          DIGEST_URI: ${{ steps.staged.outputs.digest_uri }}
          COMMIT_SHA: ${{ steps.staged.outputs.commit_sha }}
        run: |
          set -euo pipefail
          prod_json="$(gcloud run services describe "${PROD_SERVICE}" \
            --project "${GCP_PROJECT_ID}" \
            --region "${GCP_REGION}" \
            --format=json)"
          [[ "$(jq '[.status.traffic[] | select(.percent == 100 and .revisionName != null)] | length' \
            <<<"${prod_json}")" == "1" ]]
          previous_revision="$(jq -er '.status.traffic[] | select(.percent == 100 and .revisionName != null) | .revisionName' \
            <<<"${prod_json}")"
          service_name="projects/${GCP_PROJECT_ID}/locations/${GCP_REGION}/services/${PROD_SERVICE}"
          service_endpoint="https://run.googleapis.com/v2/${service_name}"
          access_token="$(gcloud auth print-access-token)"
          before_v2="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer ${access_token}" \
            "${service_endpoint}")"
          previous_labels="$(jq -ce '.labels // {}' <<<"${before_v2}")"
          access_token=
          shifted=0
          labels_touched=0
          restore_labels() {
            local token current request_body
            token="$(gcloud auth print-access-token)" || return 1
            current="$(curl --fail --silent --show-error \
              --header "Authorization: Bearer ${token}" \
              "${service_endpoint}")" || return 1
            request_body="$(jq -cn \
              --arg name "${service_name}" \
              --arg etag "$(jq -er '.etag' <<<"${current}")" \
              --argjson labels "${previous_labels}" \
              '{name: $name, etag: $etag, labels: $labels}')" || return 1
            curl --fail --silent --show-error \
              --request PATCH \
              --header "Authorization: Bearer ${token}" \
              --header "Content-Type: application/json" \
              --data-binary "${request_body}" \
              "${service_endpoint}?updateMask=labels&forceNewRevision=false" >/dev/null || return 1
            for attempt in {1..60}; do
              current="$(curl --fail --silent --show-error \
                --header "Authorization: Bearer ${token}" \
                "${service_endpoint}")" || return 1
              if [[ "$(jq -cS '.labels // {}' <<<"${current}")" == \
                "$(jq -cS . <<<"${previous_labels}")" ]]; then
                return 0
              fi
              sleep 1
            done
            return 1
          }
          rollback() {
            status=$?
            if [[ ${status} -ne 0 ]]; then
              set +e
              rollback_failed=0
              if [[ ${shifted} -eq 1 ]]; then
                echo "::warning::Post-shift verification failed; restoring ${previous_revision}."
                if ! gcloud run services update-traffic "${PROD_SERVICE}" \
                  --project "${GCP_PROJECT_ID}" \
                  --region "${GCP_REGION}" \
                  --to-revisions "${previous_revision}=100" \
                  --quiet; then
                  rollback_failed=1
                fi
                if restored_json="$(gcloud run services describe "${PROD_SERVICE}" \
                  --project "${GCP_PROJECT_ID}" \
                  --region "${GCP_REGION}" \
                  --format=json)"; then
                  restored_count="$(jq '[.status.traffic[] | select(.percent == 100 and .revisionName != null)] | length' \
                    <<<"${restored_json}")"
                  restored_revision="$(jq -r '.status.traffic[] | select(.percent == 100 and .revisionName != null) | .revisionName' \
                    <<<"${restored_json}")"
                  if [[ "${restored_count}" != "1" || "${restored_revision}" != "${previous_revision}" ]]; then
                    rollback_failed=1
                  fi
                else
                  rollback_failed=1
                fi
              fi
              if [[ ${labels_touched} -eq 1 ]] && ! restore_labels; then
                echo "::error::Automatic rollback failed to restore the prior service labels."
                rollback_failed=1
              fi
              if [[ ${rollback_failed} -ne 0 ]]; then
                echo "::error::Automatic production rollback was incomplete."
              fi
            fi
            exit "${status}"
          }
          trap rollback EXIT

          gcloud run jobs update "${PROD_MIGRATION_JOB}" \
            --project "${GCP_PROJECT_ID}" \
            --region "${GCP_REGION}" \
            --image "${DIGEST_URI}" \
            --quiet
          [[ "$(gcloud run jobs describe "${PROD_MIGRATION_JOB}" \
            --project "${GCP_PROJECT_ID}" --region "${GCP_REGION}" \
            --format='value(spec.template.spec.template.spec.containers[0].image)')" == "${DIGEST_URI}" ]]
          gcloud run jobs execute "${PROD_MIGRATION_JOB}" \
            --project "${GCP_PROJECT_ID}" \
            --region "${GCP_REGION}" \
            --wait

          candidate_tag="cand"
          labels_touched=1
          gcloud run deploy "${PROD_SERVICE}" \
            --project "${GCP_PROJECT_ID}" \
            --region "${GCP_REGION}" \
            --image "${DIGEST_URI}" \
            --update-labels "commit-sha=${COMMIT_SHA},release-sha=${COMMIT_SHA}" \
            --no-traffic \
            --tag "${candidate_tag}" \
            --revision-suffix="" \
            --quiet
          service_json="$(gcloud run services describe "${PROD_SERVICE}" \
            --project "${GCP_PROJECT_ID}" \
            --region "${GCP_REGION}" \
            --format=json)"
          candidate_count="$(jq -r --arg tag "${candidate_tag}" \
            '[.status.traffic[] | select(.tag == $tag)] | length' <<<"${service_json}")"
          [[ "${candidate_count}" == "1" ]]
          candidate_entry="$(jq -cer --arg tag "${candidate_tag}" \
            '.status.traffic[] | select(.tag == $tag) | {revisionName, url}' <<<"${service_json}")"
          candidate_revision="$(jq -er '.revisionName' <<<"${candidate_entry}")"
          candidate_url="$(jq -er '.url' <<<"${candidate_entry}")"
          candidate_revision_json="$(gcloud run revisions describe "${candidate_revision}" \
            --project "${GCP_PROJECT_ID}" \
            --region "${GCP_REGION}" \
            --format=json)"
          candidate_digest_uri="$(jq -er '.spec.containers[0].image' <<<"${candidate_revision_json}")"
          [[ "${candidate_digest_uri}" == "${DIGEST_URI}" ]]
          [[ "$(jq -r '.metadata.labels["commit-sha"]' <<<"${candidate_revision_json}")" == "${COMMIT_SHA}" ]]
          [[ "$(jq -r '.metadata.labels["release-sha"]' <<<"${candidate_revision_json}")" == "${COMMIT_SHA}" ]]
          [[ "$(jq -r '.metadata.labels["commit-sha"]' <<<"${service_json}")" == "${COMMIT_SHA}" ]]
          [[ "$(jq -r '.metadata.labels["release-sha"]' <<<"${service_json}")" == "${COMMIT_SHA}" ]]
          candidate_health="$(curl --fail --silent --show-error --connect-timeout 5 --max-time 15 \
            --retry 8 --retry-all-errors --retry-delay 3 --retry-max-time 120 \
            "${candidate_url}/health")"
          [[ "$(jq -r '.release_sha' <<<"${candidate_health}")" == "${COMMIT_SHA}" ]]

          shifted=1
          gcloud run services update-traffic "${PROD_SERVICE}" \
            --project "${GCP_PROJECT_ID}" \
            --region "${GCP_REGION}" \
            --to-revisions "${candidate_revision}=100" \
            --quiet
          service_url="$(gcloud run services describe "${PROD_SERVICE}" \
            --project "${GCP_PROJECT_ID}" \
            --region "${GCP_REGION}" \
            --format='value(status.url)')"
          service_health="$(curl --fail --silent --show-error --connect-timeout 5 --max-time 15 \
            --retry 8 --retry-all-errors --retry-delay 3 --retry-max-time 120 \
            "${service_url}/health")"
          [[ "$(jq -r '.release_sha' <<<"${service_health}")" == "${COMMIT_SHA}" ]]
          active_json="$(gcloud run services describe "${PROD_SERVICE}" \
            --project "${GCP_PROJECT_ID}" --region "${GCP_REGION}" --format=json)"
          [[ "$(jq '[.status.traffic[] | select(.percent == 100 and .revisionName != null)] | length' \
            <<<"${active_json}")" == "1" ]]
          [[ "$(jq -r '.status.traffic[] | select(.percent == 100 and .revisionName != null) | .revisionName' \
            <<<"${active_json}")" == "${candidate_revision}" ]]
          [[ "$(jq -r '.metadata.labels["commit-sha"]' <<<"${active_json}")" == "${COMMIT_SHA}" ]]
          [[ "$(jq -r '.metadata.labels["release-sha"]' <<<"${active_json}")" == "${COMMIT_SHA}" ]]
          [[ "$(gcloud run revisions describe "${candidate_revision}" \
            --project "${GCP_PROJECT_ID}" --region "${GCP_REGION}" \
            --format='value(spec.containers[0].image)')" == "${DIGEST_URI}" ]]

          # Exercise canonical-host health and auth against the Google origin.
          # Cloudflare intentionally challenges GitHub-hosted runner IPs, so its
          # edge is verified independently from a normal client after promotion.
          origin_ip="$(getent ahostsv4 ghs.googlehosted.com | awk 'NR == 1 { print $1 }')"
          [[ -n "${origin_ip}" ]]
          origin_curl=(--resolve "${PROD_HOST}:443:${origin_ip}")
          public_health="$(curl "${origin_curl[@]}" --fail --silent --show-error \
            --connect-timeout 5 --max-time 15 \
            --retry 8 --retry-all-errors --retry-delay 3 --retry-max-time 120 \
            "${PROD_E2E_BASE_URL}/health?release=${COMMIT_SHA}")"
          [[ "$(jq -r '.release_sha' <<<"${public_health}")" == "${COMMIT_SHA}" ]]
          login_status=
          for attempt in {1..12}; do
            if ! login_status="$(curl "${origin_curl[@]}" --silent --show-error \
              --connect-timeout 5 --max-time 15 \
              --header 'Cache-Control: no-cache, no-store' \
              --header 'Pragma: no-cache' \
              --dump-header "${RUNNER_TEMP}/auth-login-headers" --output /dev/null \
              --write-out '%{http_code}' \
              "${PROD_E2E_BASE_URL}/auth/login?release=${COMMIT_SHA}&attempt=${attempt}")"; then
              login_status=000
            fi
            [[ "${login_status}" == "302" ]] && break
            sleep 5
          done
          [[ "${login_status}" == "302" ]]
          auth_location="$(grep --ignore-case '^location:' "${RUNNER_TEMP}/auth-login-headers" |
            head -1 | cut -d' ' -f2- | tr -d '\r')"
          AUTH_LOCATION="${auth_location}" EXPECTED_CALLBACK="${PROD_E2E_BASE_URL}/auth/callback" python3 - <<'PY'
          import os
          from urllib.parse import parse_qs, urlparse
          location = urlparse(os.environ["AUTH_LOCATION"])
          assert f"{location.scheme}://{location.netloc}{location.path}" == "https://auth.2jog.dev/authorize"
          query = parse_qs(location.query)
          assert query.get("response_type") == ["code"]
          assert query.get("redirect_uri") == [os.environ["EXPECTED_CALLBACK"]]
          assert query.get("code_challenge_method") == ["S256"]
          for required in ("state", "nonce", "code_challenge"):
              assert query.get(required) and query[required][0]
          PY
          me_status="$(curl "${origin_curl[@]}" --silent --show-error --output "${RUNNER_TEMP}/auth-me-body" \
            --write-out '%{http_code}' "${PROD_E2E_BASE_URL}/api/auth/me")"
          [[ "${me_status}" == "401" ]]
          jq --exit-status . "${RUNNER_TEMP}/auth-me-body" >/dev/null
          logout_status="$(curl "${origin_curl[@]}" --silent --show-error --request POST \
            --header 'Origin: https://cross-origin.invalid' --output /dev/null \
            --write-out '%{http_code}' "${PROD_E2E_BASE_URL}/auth/logout")"
          [[ "${logout_status}" =~ ^4[0-9]{2}$ ]]
          github_activity="$(curl "${origin_curl[@]}" --fail --silent --show-error \
            --retry 5 --retry-all-errors --retry-delay 2 \
            "${PROD_E2E_BASE_URL}/api/public/github/activity?release=${COMMIT_SHA}")"
          jq -e '
            (.login | type == "string" and length > 0)
            and (.contributionsCollection.contributionCalendar.weeks
              | type == "array"
                and length > 0
                and all(
                  .[];
                  (.contributionDays | type == "array" and length > 0)
                )
            )
          ' <<<"${github_activity}" >/dev/null
          github_activity=

          gcloud run services update-traffic "${PROD_SERVICE}" \
            --project "${GCP_PROJECT_ID}" \
            --region "${GCP_REGION}" \
            --clear-tags \
            --quiet
          mapfile -t revisions < <(gcloud run revisions list \
            --service "${PROD_SERVICE}" \
            --project "${GCP_PROJECT_ID}" \
            --region "${GCP_REGION}" \
            --sort-by='~metadata.creationTimestamp' \
            --format='value(metadata.name)')
          for revision in "${revisions[@]}"; do
            [[ "${revision}" == "${candidate_revision}" || "${revision}" == "${previous_revision}" ]] && continue
            gcloud run revisions delete "${revision}" \
              --project "${GCP_PROJECT_ID}" \
              --region "${GCP_REGION}" \
              --quiet
          done
          trap - EXIT

          {
            echo "### Production promotion"
            echo
            echo "- Commit: \`${COMMIT_SHA}\`"
            echo "- Digest: \`${DIGEST_URI##*@}\`"
            echo "- Active revision: \`${candidate_revision}\`"
            echo "- Rollback revision retained: \`${previous_revision}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
