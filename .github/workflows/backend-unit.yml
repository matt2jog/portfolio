name: Backend Unit

# Runs the node:test backend suite: DB connectivity + core backend actions.
# Requires the DATABASE_URL secret to point at a reachable Postgres instance
# (typically a Supabase test database). If you wire this up against the prod
# DB, keep the suite read-only.

on:
  pull_request:
  push:
    branches:
      - main
      - prod
  workflow_dispatch:

jobs:
  backend-unit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run backend unit tests
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_CA_CERT: ${{ secrets.SUPABASE_CA_CERT }}
        run: npx tsx --test src/tests/backend-unit/*.test.ts
