name: Verify, build, and stage

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: portfolio-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOCKER_BUILD_RECORD_RETENTION_DAYS: "1"
  GCP_PROJECT_ID: personal-brand-501801
  GCP_REGION: us-east4
  COMMIT_SHA: ${{ github.sha }}
  GAR_REPOSITORY: portfolio
  IMAGE_NAME: portfolio
  LOCAL_IMAGE: portfolio-ci:${{ github.sha }}
  STAGING_SERVICE: portfolio--staging
  STAGING_MIGRATION_JOB: portfolio-migrate--staging
  STAGING_E2E_BASE_URL: ${{ vars.STAGING_E2E_BASE_URL || 'https://portfolio-staging.2jog.dev' }}
  WIF_PROVIDER: projects/601853536613/locations/global/workloadIdentityPools/github-actions/providers/github-actions
  DEPLOY_SERVICE_ACCOUNT: portfolio-deploy@personal-brand-501801.iam.gserviceaccount.com

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: portfolio_test
          POSTGRES_PASSWORD: ${{ format('{0}-{1}', github.run_id, github.run_attempt) }}
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d portfolio_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 8
    env:
      DATABASE_URL: ${{ format('postgresql://postgres:{0}-{1}@127.0.0.1:5432/portfolio_test', github.run_id, github.run_attempt) }}
      TEST_DATABASE_URL: ${{ format('postgresql://postgres:{0}-{1}@127.0.0.1:5432/portfolio_test', github.run_id, github.run_attempt) }}
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Block committed secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          format: table
          exit-code: "1"
          hide-progress: true

      - name: Report high filesystem findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: misconfig,vuln
          severity: HIGH,CRITICAL
          format: table
          exit-code: "0"
          hide-progress: true

      - name: Block critical filesystem findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: misconfig,vuln
          severity: CRITICAL
          format: table
          exit-code: "1"
          hide-progress: true

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Cache Playwright browser
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install locked dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Lint, type-check, and enforce backend/client coverage
        run: |
          npm run lint
          npm run check
          npm run test:coverage
          npm run test:client-coverage

      - name: Prove migrations and backend integration on PostgreSQL 17
        run: |
          npm run db:test:provision
          npm run db:migrate
          npm run test:backend-integration

      - name: Run UI tests and build the production bundle
        run: |
          npm run test:ui
          npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build exact production image once
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          pull: true
          tags: ${{ env.LOCAL_IMAGE }}
          labels: |
            org.opencontainers.image.revision=${{ env.COMMIT_SHA }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=portfolio
          cache-to: ${{ (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && 'type=gha,mode=max,scope=portfolio' || '' }}

      - name: Report high image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.LOCAL_IMAGE }}
          scanners: vuln
          severity: HIGH,CRITICAL
          format: table
          exit-code: "0"

      - name: Block critical image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.LOCAL_IMAGE }}
          scanners: vuln
          severity: CRITICAL
          format: table
          exit-code: "1"

      - name: Block secrets in the image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.LOCAL_IMAGE }}
          scanners: secret
          format: table
          exit-code: "1"

      - name: Save the verified image
        if: github.actor_id == '81255678' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
        run: docker save --output "${RUNNER_TEMP}/portfolio-image.tar" "${LOCAL_IMAGE}"

      - name: Hand the verified image to the trusted job
        if: github.actor_id == '81255678' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: portfolio-image-${{ env.COMMIT_SHA }}
          path: ${{ runner.temp }}/portfolio-image.tar
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  publish:
    name: Publish immutable verified image
    needs: verify
    if: github.actor_id == '81255678' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      id-token: write
    outputs:
      digest_uri: ${{ steps.image.outputs.digest_uri }}
    steps:
      - name: Download verified image
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: portfolio-image-${{ env.COMMIT_SHA }}
          path: ${{ runner.temp }}

      - name: Load verified image
        run: docker load --input "${RUNNER_TEMP}/portfolio-image.tar"

      - name: Authenticate to Artifact Registry
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Publish the verified SHA image
        id: image
        shell: bash
        run: |
          set -euo pipefail
          registry="${GCP_REGION}-docker.pkg.dev"
          image_uri="${registry}/${GCP_PROJECT_ID}/${GAR_REPOSITORY}/${IMAGE_NAME}"
          remote_image="${image_uri}:${COMMIT_SHA}"
          gcloud auth configure-docker "${registry}" --quiet
          local_image_id="$(docker image inspect "${LOCAL_IMAGE}" --format='{{.Id}}')"
          [[ "${local_image_id}" =~ ^sha256:[0-9a-f]{64}$ ]]
          local_revision="$(docker image inspect "${LOCAL_IMAGE}" \
            --format='{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
          [[ "${local_revision}" == "${COMMIT_SHA}" ]]
          if digest="$(gcloud artifacts docker images describe "${remote_image}" \
            --project "${GCP_PROJECT_ID}" \
            --format='value(image_summary.digest)' 2>/dev/null)"; then
            [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
          else
            docker tag "${LOCAL_IMAGE}" "${remote_image}"
            docker push "${remote_image}"
            digest="$(gcloud artifacts docker images describe "${remote_image}" \
              --project "${GCP_PROJECT_ID}" \
              --format='value(image_summary.digest)')"
            [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
          fi
          docker pull "${remote_image}" >/dev/null
          remote_image_id="$(docker image inspect "${remote_image}" --format='{{.Id}}')"
          if [[ "${remote_image_id}" != "${local_image_id}" ]]; then
            echo "::error::The immutable commit tag ${COMMIT_SHA} does not match the image that passed verification."
            exit 1
          fi
          remote_revision="$(docker image inspect "${remote_image}" \
            --format='{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
          if [[ "${remote_revision}" != "${COMMIT_SHA}" ]]; then
            echo "::error::The immutable commit tag ${COMMIT_SHA} does not carry its exact OCI revision label."
            exit 1
          fi
          resolved_digest="$(gcloud artifacts docker images describe "${remote_image}" \
            --project "${GCP_PROJECT_ID}" \
            --format='value(image_summary.digest)')"
          [[ "${resolved_digest}" == "${digest}" ]]
          echo "digest_uri=${image_uri}@${digest}" >> "${GITHUB_OUTPUT}"

  stage:
    name: Deploy staging and run live browser E2E
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    environment: staging
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out source for live E2E
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Run staging migration
        run: |
          gcloud run jobs update "${STAGING_MIGRATION_JOB}" \
            --project "${GCP_PROJECT_ID}" \
            --region "${GCP_REGION}" \
            --image "${{ needs.publish.outputs.digest_uri }}" \
            --quiet
          [[ "$(gcloud run jobs describe "${STAGING_MIGRATION_JOB}" \
            --project "${GCP_PROJECT_ID}" --region "${GCP_REGION}" \
            --format='value(spec.template.spec.template.spec.containers[0].image)')" == "${{ needs.publish.outputs.digest_uri }}" ]]
          gcloud run jobs execute "${STAGING_MIGRATION_JOB}" \
            --project "${GCP_PROJECT_ID}" \
            --region "${GCP_REGION}" \
            --wait

      - name: Deploy exact digest to staging
        id: staging
        shell: bash
        run: |
          set -euo pipefail
          service_json="$(gcloud run services describe "${STAGING_SERVICE}" \
            --project "${GCP_PROJECT_ID}" \
            --region "${GCP_REGION}" \
            --format=json)"
          [[ "$(jq '[.status.traffic[] | select(.percent == 100 and .revisionName != null)] | length' \
            <<<"${service_json}")" == "1" ]]
          previous_revision="$(jq -er \
            '.status.traffic[] | select(.percent == 100 and .revisionName != null) | .revisionName' \
            <<<"${service_json}")"
          candidate_tag="stg-cand"
          staging_revision="$(gcloud run deploy "${STAGING_SERVICE}" \
            --project "${GCP_PROJECT_ID}" \
            --region "${GCP_REGION}" \
            --image "${{ needs.publish.outputs.digest_uri }}" \
            --revision-suffix="" \
            --no-traffic \
            --tag "${candidate_tag}" \
            --format='value(status.latestCreatedRevisionName)' \
            --quiet)"
          [[ -n "${staging_revision}" ]]
          deployed_digest_uri="$(gcloud run revisions describe "${staging_revision}" \
            --project "${GCP_PROJECT_ID}" \
            --region "${GCP_REGION}" \
            --format='value(spec.containers[0].image)')"
          [[ "${deployed_digest_uri}" == "${{ needs.publish.outputs.digest_uri }}" ]]
          service_json="$(gcloud run services describe "${STAGING_SERVICE}" \
            --project "${GCP_PROJECT_ID}" \
            --region "${GCP_REGION}" \
            --format=json)"
          [[ "$(jq '[.status.traffic[] | select(.percent == 100 and .revisionName != null)] | length' \
            <<<"${service_json}")" == "1" ]]
          [[ "$(jq -r '.status.traffic[] | select(.percent == 100 and .revisionName != null) | .revisionName' \
            <<<"${service_json}")" == "${previous_revision}" ]]
          candidate_url="$(jq -er --arg tag "${candidate_tag}" --arg revision "${staging_revision}" \
            '.status.traffic[]
             | select(.tag == $tag and .revisionName == $revision)
             | .url' <<<"${service_json}")"
          {
            echo "revision=${staging_revision}"
            echo "digest_uri=${deployed_digest_uri}"
            echo "candidate_url=${candidate_url}"
            echo "previous_revision=${previous_revision}"
          } >> "${GITHUB_OUTPUT}"

      - name: Set up browser E2E dependencies
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: npm

      - name: Cache Playwright browser
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Run tagged candidate endpoint gate
        shell: bash
        env:
          CANDIDATE_URL: ${{ steps.staging.outputs.candidate_url }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 10 --retry-all-errors \
            --retry-delay 3 "${CANDIDATE_URL}/health" >/dev/null

      - name: Shift staging traffic and run endpoint/browser E2E with verified rollback
        shell: bash
        env:
          STAGING_REVISION: ${{ steps.staging.outputs.revision }}
          PREVIOUS_REVISION: ${{ steps.staging.outputs.previous_revision }}
        run: |
          set -euo pipefail
          traffic_touched=0
          rollback() {
            status=$?
            if [[ ${status} -ne 0 && ${traffic_touched} -eq 1 ]]; then
              set +e
              rollback_failed=0
              if ! gcloud run services update-traffic "${STAGING_SERVICE}" \
                --project "${GCP_PROJECT_ID}" \
                --region "${GCP_REGION}" \
                --to-revisions "${PREVIOUS_REVISION}=100" \
                --quiet; then
                rollback_failed=1
              fi
              if [[ ${rollback_failed} -eq 0 ]]; then
                restored_json="$(gcloud run services describe "${STAGING_SERVICE}" \
                  --project "${GCP_PROJECT_ID}" \
                  --region "${GCP_REGION}" \
                  --format=json)"
                restored_count="$(jq \
                  '[.status.traffic[] | select(.percent == 100 and .revisionName != null)] | length' \
                  <<<"${restored_json}")"
                restored_revision="$(jq -r \
                  '.status.traffic[] | select(.percent == 100 and .revisionName != null) | .revisionName' \
                  <<<"${restored_json}")"
                if [[ "${restored_count}" != "1" || "${restored_revision}" != "${PREVIOUS_REVISION}" ]]; then
                  rollback_failed=1
                fi
              fi
              if [[ ${rollback_failed} -ne 0 ]]; then
                echo "::error::Automatic staging rollback failed to restore ${PREVIOUS_REVISION}."
              fi
            fi
            exit "${status}"
          }
          trap rollback EXIT

          traffic_touched=1
          gcloud run services update-traffic "${STAGING_SERVICE}" \
            --project "${GCP_PROJECT_ID}" \
            --region "${GCP_REGION}" \
            --to-revisions "${STAGING_REVISION}=100" \
            --quiet
          service_json="$(gcloud run services describe "${STAGING_SERVICE}" \
            --project "${GCP_PROJECT_ID}" \
            --region "${GCP_REGION}" \
            --format=json)"
          [[ "$(jq '[.status.traffic[] | select(.percent == 100 and .revisionName != null)] | length' \
            <<<"${service_json}")" == "1" ]]
          [[ "$(jq -r '.status.traffic[] | select(.percent == 100 and .revisionName != null) | .revisionName' \
            <<<"${service_json}")" == "${STAGING_REVISION}" ]]
          service_url="$(jq -er '.status.url' <<<"${service_json}")"
          curl --fail --silent --show-error --retry 10 --retry-all-errors \
            --retry-delay 3 "${service_url}/health" >/dev/null
          login_status="$(curl --silent --show-error \
            --dump-header "${RUNNER_TEMP}/auth-login-headers" --output /dev/null \
            --write-out '%{http_code}' "${STAGING_E2E_BASE_URL}/auth/login")"
          [[ "${login_status}" == "302" ]]
          auth_location="$(grep --ignore-case '^location:' "${RUNNER_TEMP}/auth-login-headers" |
            head -1 | cut -d' ' -f2- | tr -d '\r')"
          AUTH_LOCATION="${auth_location}" EXPECTED_CALLBACK="${STAGING_E2E_BASE_URL}/auth/callback" python3 - <<'PY'
          import os
          from urllib.parse import parse_qs, urlparse
          location = urlparse(os.environ["AUTH_LOCATION"])
          assert f"{location.scheme}://{location.netloc}{location.path}" == "https://auth.2jog.dev/authorize"
          query = parse_qs(location.query)
          assert query.get("response_type") == ["code"]
          assert query.get("redirect_uri") == [os.environ["EXPECTED_CALLBACK"]]
          assert query.get("code_challenge_method") == ["S256"]
          for required in ("state", "nonce", "code_challenge"):
              assert query.get(required) and query[required][0]
          PY
          me_status="$(curl --silent --show-error \
            --dump-header "${RUNNER_TEMP}/auth-me-headers" --output "${RUNNER_TEMP}/auth-me-body" \
            --write-out '%{http_code}' "${STAGING_E2E_BASE_URL}/api/auth/me")"
          [[ "${me_status}" == "401" ]]
          grep --ignore-case --quiet '^content-type: application/json' "${RUNNER_TEMP}/auth-me-headers"
          jq --exit-status . "${RUNNER_TEMP}/auth-me-body" >/dev/null
          logout_status="$(curl --silent --show-error --request POST \
            --header 'Origin: https://cross-origin.invalid' --output /dev/null \
            --write-out '%{http_code}' "${STAGING_E2E_BASE_URL}/auth/logout")"
          [[ "${logout_status}" =~ ^4[0-9]{2}$ ]]
          npm ci
          npx playwright install --with-deps chromium
          PLAYWRIGHT_BASE_URL="${STAGING_E2E_BASE_URL}" npm run test:live-smoke
          gcloud run services update-traffic "${STAGING_SERVICE}" \
            --project "${GCP_PROJECT_ID}" \
            --region "${GCP_REGION}" \
            --clear-tags \
            --quiet
          traffic_touched=0
          trap - EXIT

      - name: Mark the tested staging release eligible
        shell: bash
        run: |
          set -euo pipefail
          migration_digest_uri="$(gcloud run jobs describe "${STAGING_MIGRATION_JOB}" \
            --project "${GCP_PROJECT_ID}" \
            --region "${GCP_REGION}" \
            --format='value(spec.template.spec.template.spec.containers[0].image)')"
          [[ "${migration_digest_uri}" == "${{ steps.staging.outputs.digest_uri }}" ]]

          service_name="projects/${GCP_PROJECT_ID}/locations/${GCP_REGION}/services/${STAGING_SERVICE}"
          service_endpoint="https://run.googleapis.com/v2/${service_name}"
          access_token="$(gcloud auth print-access-token)"
          before_v2="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer ${access_token}" \
            "${service_endpoint}")"
          before_v1="$(gcloud run services describe "${STAGING_SERVICE}" \
            --project "${GCP_PROJECT_ID}" \
            --region "${GCP_REGION}" \
            --format=json)"
          before_latest_created="$(jq -er '.latestCreatedRevision' <<<"${before_v2}")"
          before_traffic="$(jq -cS '.status.traffic' <<<"${before_v1}")"
          expected_labels="$(jq -ce --arg sha "${COMMIT_SHA}" \
            '(.labels // {}) + {"commit-sha": $sha}' <<<"${before_v2}")"
          request_body="$(jq -cn \
            --arg name "${service_name}" \
            --arg etag "$(jq -er '.etag' <<<"${before_v2}")" \
            --argjson labels "${expected_labels}" \
            '{name: $name, etag: $etag, labels: $labels}')"
          patch_response="$(curl --fail --silent --show-error \
            --request PATCH \
            --header "Authorization: Bearer ${access_token}" \
            --header "Content-Type: application/json" \
            --data-binary "${request_body}" \
            "${service_endpoint}?updateMask=labels&forceNewRevision=false")"
          jq -e '.name | type == "string" and length > 0' <<<"${patch_response}" >/dev/null

          for attempt in {1..60}; do
            after_v2="$(curl --fail --silent --show-error \
              --header "Authorization: Bearer ${access_token}" \
              "${service_endpoint}")"
            if [[ "$(jq -cS '.labels // {}' <<<"${after_v2}")" == \
              "$(jq -cS . <<<"${expected_labels}")" ]]; then
              break
            fi
            if [[ ${attempt} -eq 60 ]]; then
              echo "::error::Staging release labels did not converge after metadata PATCH."
              exit 1
            fi
            sleep 1
          done
          access_token=

          service_json="$(gcloud run services describe "${STAGING_SERVICE}" \
            --project "${GCP_PROJECT_ID}" \
            --region "${GCP_REGION}" \
            --format=json)"
          [[ "$(jq -r '.metadata.labels["commit-sha"]' <<<"${service_json}")" == "${COMMIT_SHA}" ]]
          [[ "$(jq -r '.latestCreatedRevision' <<<"${after_v2}")" == "${before_latest_created}" ]]
          [[ "$(jq -cS '.status.traffic' <<<"${service_json}")" == "${before_traffic}" ]]
          [[ "$(jq '[.status.traffic[] | select(.percent == 100 and .revisionName != null)] | length' \
            <<<"${service_json}")" == "1" ]]
          [[ "$(jq -r '.status.traffic[] | select(.percent == 100 and .revisionName != null) | .revisionName' \
            <<<"${service_json}")" == "${{ steps.staging.outputs.revision }}" ]]
          deployed_digest_uri="$(gcloud run revisions describe "${{ steps.staging.outputs.revision }}" \
            --project "${GCP_PROJECT_ID}" \
            --region "${GCP_REGION}" \
            --format='value(spec.containers[0].image)')"
          [[ "${deployed_digest_uri}" == "${{ steps.staging.outputs.digest_uri }}" ]]
