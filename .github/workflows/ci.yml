name: Verify, build, and stage

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: portfolio-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOCKER_BUILD_RECORD_RETENTION_DAYS: "1"
  GCP_PROJECT_ID: personal-brand-501801
  GCP_REGION: us-east4
  COMMIT_SHA: ${{ github.sha }}
  GAR_REPOSITORY: portfolio
  IMAGE_NAME: portfolio
  LOCAL_IMAGE: portfolio-ci:${{ github.sha }}
  STAGING_SERVICE: portfolio--staging
  STAGING_E2E_BASE_URL: ${{ vars.STAGING_E2E_BASE_URL || 'https://portfolio-staging.2jog.dev' }}
  WIF_PROVIDER: projects/601853536613/locations/global/workloadIdentityPools/github-actions/providers/github-actions
  DEPLOY_SERVICE_ACCOUNT: portfolio-deploy@personal-brand-501801.iam.gserviceaccount.com

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Configure the isolated test database
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "TURSO_DATABASE_URL=file:${RUNNER_TEMP}/portfolio-career.db"
            echo "TEST_TURSO_DATABASE_URL=file:${RUNNER_TEMP}/portfolio-career.db"
          } >> "${GITHUB_ENV}"

      - name: Verify direct Infisical runtime wrapper
        shell: bash
        run: sh docker/infisical-runtime.test.sh

      - name: Block committed secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          format: table
          exit-code: "1"
          hide-progress: true

      - name: Report high filesystem findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: misconfig,vuln
          severity: HIGH,CRITICAL
          format: table
          exit-code: "0"
          hide-progress: true

      - name: Block critical filesystem findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: misconfig,vuln
          severity: CRITICAL
          format: table
          exit-code: "1"
          hide-progress: true

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Cache Playwright browser
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install locked dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Lint, type-check, and enforce backend/client coverage
        run: |
          npm run lint
          npm run check
          npm run test:coverage
          npm run test:client-coverage

      - name: Prove Portfolio read-model contract and backend integration
        run: npm run test:backend-integration

      - name: Run UI tests and build the production bundle
        run: |
          npm run test:ui
          npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build exact production image once
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          pull: true
          tags: ${{ env.LOCAL_IMAGE }}
          build-args: |
            VCS_REF=${{ env.COMMIT_SHA }}
          labels: |
            org.opencontainers.image.revision=${{ env.COMMIT_SHA }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=portfolio
          cache-to: ${{ (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && 'type=gha,mode=max,scope=portfolio' || '' }}

      - name: Verify image release provenance
        shell: bash
        run: |
          set -euo pipefail
          image_json="$(docker image inspect "${LOCAL_IMAGE}")"
          image_revision="$(jq -er '.[0].Config.Labels["org.opencontainers.image.revision"]' \
            <<<"${image_json}")"
          image_release_sha="$(jq -er \
            '.[0].Config.Env[] | select(startswith("PORTFOLIO_RELEASE_SHA="))
              | ltrimstr("PORTFOLIO_RELEASE_SHA=")' <<<"${image_json}")"
          [[ "${image_revision}" == "${COMMIT_SHA}" ]]
          [[ "${image_release_sha}" == "${COMMIT_SHA}" ]]
          [[ "${image_release_sha}" =~ ^[0-9a-f]{40}$ ]]

      - name: Report high image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.LOCAL_IMAGE }}
          scanners: vuln
          severity: HIGH,CRITICAL
          format: table
          exit-code: "0"

      - name: Block critical image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.LOCAL_IMAGE }}
          scanners: vuln
          severity: CRITICAL
          format: table
          exit-code: "1"

      - name: Block secrets in the image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.LOCAL_IMAGE }}
          scanners: secret
          format: table
          exit-code: "1"

      - name: Save the verified image
        if: github.actor_id == '81255678' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
        run: docker save --output "${RUNNER_TEMP}/portfolio-image.tar" "${LOCAL_IMAGE}"

      - name: Hand the verified image to the trusted job
        if: github.actor_id == '81255678' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: portfolio-image-${{ env.COMMIT_SHA }}
          path: ${{ runner.temp }}/portfolio-image.tar
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  publish:
    name: Publish immutable verified image
    needs: verify
    if: github.actor_id == '81255678' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      id-token: write
    outputs:
      digest_uri: ${{ steps.image.outputs.digest_uri }}
    steps:
      - name: Download verified image
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: portfolio-image-${{ env.COMMIT_SHA }}
          path: ${{ runner.temp }}

      - name: Load verified image
        run: docker load --input "${RUNNER_TEMP}/portfolio-image.tar"

      - name: Authenticate to Artifact Registry
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Publish the verified SHA image
        id: image
        shell: bash
        run: |
          set -euo pipefail
          registry="${GCP_REGION}-docker.pkg.dev"
          image_uri="${registry}/${GCP_PROJECT_ID}/${GAR_REPOSITORY}/${IMAGE_NAME}"
          remote_image="${image_uri}:${COMMIT_SHA}"
          gcloud auth configure-docker "${registry}" --quiet
          local_image_id="$(docker image inspect "${LOCAL_IMAGE}" --format='{{.Id}}')"
          [[ "${local_image_id}" =~ ^sha256:[0-9a-f]{64}$ ]]
          local_revision="$(docker image inspect "${LOCAL_IMAGE}" \
            --format='{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
          [[ "${local_revision}" == "${COMMIT_SHA}" ]]
          if digest="$(gcloud artifacts docker images describe "${remote_image}" \
            --project "${GCP_PROJECT_ID}" \
            --format='value(image_summary.digest)' 2>/dev/null)"; then
            [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
          else
            docker tag "${LOCAL_IMAGE}" "${remote_image}"
            docker push "${remote_image}"
            digest="$(gcloud artifacts docker images describe "${remote_image}" \
              --project "${GCP_PROJECT_ID}" \
              --format='value(image_summary.digest)')"
            [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
          fi
          docker pull "${remote_image}" >/dev/null
          remote_image_id="$(docker image inspect "${remote_image}" --format='{{.Id}}')"
          if [[ "${remote_image_id}" != "${local_image_id}" ]]; then
            echo "::error::The immutable commit tag ${COMMIT_SHA} does not match the image that passed verification."
            exit 1
          fi
          remote_revision="$(docker image inspect "${remote_image}" \
            --format='{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
          if [[ "${remote_revision}" != "${COMMIT_SHA}" ]]; then
            echo "::error::The immutable commit tag ${COMMIT_SHA} does not carry its exact OCI revision label."
            exit 1
          fi
          remote_release_sha="$(docker image inspect "${remote_image}" \
            --format='{{ range .Config.Env }}{{ println . }}{{ end }}' \
            | sed -n 's/^PORTFOLIO_RELEASE_SHA=//p')"
          if [[ "${remote_release_sha}" != "${COMMIT_SHA}" ]]; then
            echo "::error::The immutable commit tag ${COMMIT_SHA} does not carry its exact runtime release SHA."
            exit 1
          fi
          resolved_digest="$(gcloud artifacts docker images describe "${remote_image}" \
            --project "${GCP_PROJECT_ID}" \
            --format='value(image_summary.digest)')"
          [[ "${resolved_digest}" == "${digest}" ]]
          echo "digest_uri=${image_uri}@${digest}" >> "${GITHUB_OUTPUT}"

  stage:
    name: Deploy staging and run live browser E2E
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    environment: staging
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out source for live E2E
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Capture staging rollback baseline
        id: rollback_baseline
        shell: bash
        run: |
          set -euo pipefail
          service_json="$(gcloud run services describe "${STAGING_SERVICE}" \
            --project "${GCP_PROJECT_ID}" \
            --region "${GCP_REGION}" \
            --format=json)"
          [[ "$(jq '[.status.traffic[] | select(.percent == 100 and .revisionName != null)] | length' \
            <<<"${service_json}")" == "1" ]]
          previous_revision="$(jq -er \
            '.status.traffic[] | select(.percent == 100 and .revisionName != null) | .revisionName' \
            <<<"${service_json}")"

          service_name="projects/${GCP_PROJECT_ID}/locations/${GCP_REGION}/services/${STAGING_SERVICE}"
          service_endpoint="https://run.googleapis.com/v2/${service_name}"
          access_token="$(gcloud auth print-access-token)"
          service_v2="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer ${access_token}" \
            "${service_endpoint}")"
          previous_labels="$(jq -ce '.labels // {}' <<<"${service_v2}")"
          access_token=

          {
            echo "revision=${previous_revision}"
            echo "labels=${previous_labels}"
          } >> "${GITHUB_OUTPUT}"

      - name: Deploy exact digest to staging
        id: staging
        shell: bash
        run: |
          set -euo pipefail
          service_json="$(gcloud run services describe "${STAGING_SERVICE}" \
            --project "${GCP_PROJECT_ID}" \
            --region "${GCP_REGION}" \
            --format=json)"
          [[ "$(jq '[.status.traffic[] | select(.percent == 100 and .revisionName != null)] | length' \
            <<<"${service_json}")" == "1" ]]
          previous_revision="$(jq -er \
            '.status.traffic[] | select(.percent == 100 and .revisionName != null) | .revisionName' \
            <<<"${service_json}")"
          candidate_tag="stg-cand"
          staging_revision="$(gcloud run deploy "${STAGING_SERVICE}" \
            --project "${GCP_PROJECT_ID}" \
            --region "${GCP_REGION}" \
            --image "${{ needs.publish.outputs.digest_uri }}" \
            --revision-suffix="" \
            --no-traffic \
            --tag "${candidate_tag}" \
            --format='value(status.latestCreatedRevisionName)' \
            --quiet)"
          [[ -n "${staging_revision}" ]]
          deployed_digest_uri="$(gcloud run revisions describe "${staging_revision}" \
            --project "${GCP_PROJECT_ID}" \
            --region "${GCP_REGION}" \
            --format='value(spec.containers[0].image)')"
          [[ "${deployed_digest_uri}" == "${{ needs.publish.outputs.digest_uri }}" ]]
          service_json="$(gcloud run services describe "${STAGING_SERVICE}" \
            --project "${GCP_PROJECT_ID}" \
            --region "${GCP_REGION}" \
            --format=json)"
          [[ "$(jq '[.status.traffic[] | select(.percent == 100 and .revisionName != null)] | length' \
            <<<"${service_json}")" == "1" ]]
          [[ "$(jq -r '.status.traffic[] | select(.percent == 100 and .revisionName != null) | .revisionName' \
            <<<"${service_json}")" == "${previous_revision}" ]]
          candidate_url="$(jq -er --arg tag "${candidate_tag}" --arg revision "${staging_revision}" \
            '.status.traffic[]
             | select(.tag == $tag and .revisionName == $revision)
             | .url' <<<"${service_json}")"
          {
            echo "revision=${staging_revision}"
            echo "digest_uri=${deployed_digest_uri}"
            echo "candidate_url=${candidate_url}"
            echo "previous_revision=${previous_revision}"
          } >> "${GITHUB_OUTPUT}"

      - name: Set up browser E2E dependencies
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: npm

      - name: Cache Playwright browser
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Run tagged candidate endpoint gate
        shell: bash
        env:
          CANDIDATE_URL: ${{ steps.staging.outputs.candidate_url }}
        run: |
          set -euo pipefail
          candidate_health="$(curl --fail --silent --show-error \
            --connect-timeout 5 --max-time 15 --retry 10 --retry-all-errors \
            --retry-delay 3 "${CANDIDATE_URL}/health")"
          [[ "$(jq -r '.release_sha' <<<"${candidate_health}")" == "${COMMIT_SHA}" ]]

      - name: Shift staging traffic and run endpoint/browser E2E with verified rollback
        shell: bash
        env:
          STAGING_REVISION: ${{ steps.staging.outputs.revision }}
          PREVIOUS_REVISION: ${{ steps.staging.outputs.previous_revision }}
        run: |
          set -euo pipefail
          traffic_touched=0
          rollback() {
            status=$?
            if [[ ${status} -ne 0 && ${traffic_touched} -eq 1 ]]; then
              set +e
              rollback_failed=0
              if ! gcloud run services update-traffic "${STAGING_SERVICE}" \
                --project "${GCP_PROJECT_ID}" \
                --region "${GCP_REGION}" \
                --to-revisions "${PREVIOUS_REVISION}=100" \
                --quiet; then
                rollback_failed=1
              fi
              if [[ ${rollback_failed} -eq 0 ]]; then
                restored_json="$(gcloud run services describe "${STAGING_SERVICE}" \
                  --project "${GCP_PROJECT_ID}" \
                  --region "${GCP_REGION}" \
                  --format=json)"
                restored_count="$(jq \
                  '[.status.traffic[] | select(.percent == 100 and .revisionName != null)] | length' \
                  <<<"${restored_json}")"
                restored_revision="$(jq -r \
                  '.status.traffic[] | select(.percent == 100 and .revisionName != null) | .revisionName' \
                  <<<"${restored_json}")"
                if [[ "${restored_count}" != "1" || "${restored_revision}" != "${PREVIOUS_REVISION}" ]]; then
                  rollback_failed=1
                fi
              fi
              if [[ ${rollback_failed} -ne 0 ]]; then
                echo "::error::Automatic staging rollback failed to restore ${PREVIOUS_REVISION}."
              fi
            fi
            exit "${status}"
          }
          trap rollback EXIT

          traffic_touched=1
          gcloud run services update-traffic "${STAGING_SERVICE}" \
            --project "${GCP_PROJECT_ID}" \
            --region "${GCP_REGION}" \
            --to-revisions "${STAGING_REVISION}=100" \
            --quiet
          service_json="$(gcloud run services describe "${STAGING_SERVICE}" \
            --project "${GCP_PROJECT_ID}" \
            --region "${GCP_REGION}" \
            --format=json)"
          [[ "$(jq '[.status.traffic[] | select(.percent == 100 and .revisionName != null)] | length' \
            <<<"${service_json}")" == "1" ]]
          [[ "$(jq -r '.status.traffic[] | select(.percent == 100 and .revisionName != null) | .revisionName' \
            <<<"${service_json}")" == "${STAGING_REVISION}" ]]
          service_url="$(jq -er '.status.url' <<<"${service_json}")"
          service_health="$(curl --fail --silent --show-error \
            --connect-timeout 5 --max-time 15 --retry 10 --retry-all-errors \
            --retry-delay 3 "${service_url}/health")"
          [[ "$(jq -r '.release_sha' <<<"${service_health}")" == "${COMMIT_SHA}" ]]
          public_health="$(curl --fail --silent --show-error \
            --connect-timeout 5 --max-time 15 --retry 10 --retry-all-errors \
            --retry-delay 3 "${STAGING_E2E_BASE_URL}/health?release=${COMMIT_SHA}")"
          [[ "$(jq -r '.release_sha' <<<"${public_health}")" == "${COMMIT_SHA}" ]]
          # Portfolio is public and has no browser-auth surface. Canonical career
          # mutations belong to Admin, so stale auth endpoints must stay absent.
          for route in /auth/login /api/auth/me; do
            status="$(curl --silent --show-error --output /dev/null \
              --write-out '%{http_code}' "${STAGING_E2E_BASE_URL}${route}")"
            [[ "${status}" == "404" ]]
          done
          logout_status="$(curl --silent --show-error --request POST \
            --header 'Origin: https://cross-origin.invalid' --output /dev/null \
            --write-out '%{http_code}' "${STAGING_E2E_BASE_URL}/auth/logout")"
          [[ "${logout_status}" == "404" ]]
          npm ci
          npx playwright install --with-deps chromium
          PLAYWRIGHT_BASE_URL="${STAGING_E2E_BASE_URL}" npm run test:live-smoke
          gcloud run services update-traffic "${STAGING_SERVICE}" \
            --project "${GCP_PROJECT_ID}" \
            --region "${GCP_REGION}" \
            --clear-tags \
            --quiet
          traffic_touched=0
          trap - EXIT

      - name: Mark the tested staging release eligible
        shell: bash
        run: |
          set -euo pipefail
          service_name="projects/${GCP_PROJECT_ID}/locations/${GCP_REGION}/services/${STAGING_SERVICE}"
          service_endpoint="https://run.googleapis.com/v2/${service_name}"
          access_token="$(gcloud auth print-access-token)"
          before_v2="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer ${access_token}" \
            "${service_endpoint}")"
          before_v1="$(gcloud run services describe "${STAGING_SERVICE}" \
            --project "${GCP_PROJECT_ID}" \
            --region "${GCP_REGION}" \
            --format=json)"
          before_latest_created="$(jq -er '.latestCreatedRevision' <<<"${before_v2}")"
          before_traffic="$(jq -cS '.status.traffic' <<<"${before_v1}")"
          expected_labels="$(jq -ce --arg sha "${COMMIT_SHA}" \
            '(.labels // {}) + {"commit-sha": $sha, "release-sha": $sha}' <<<"${before_v2}")"
          request_body="$(jq -cn \
            --arg name "${service_name}" \
            --arg etag "$(jq -er '.etag' <<<"${before_v2}")" \
            --argjson labels "${expected_labels}" \
            '{name: $name, etag: $etag, labels: $labels}')"
          patch_response="$(curl --fail --silent --show-error \
            --request PATCH \
            --header "Authorization: Bearer ${access_token}" \
            --header "Content-Type: application/json" \
            --data-binary "${request_body}" \
            "${service_endpoint}?updateMask=labels&forceNewRevision=false")"
          jq -e '.name | type == "string" and length > 0' <<<"${patch_response}" >/dev/null

          for attempt in {1..60}; do
            after_v2="$(curl --fail --silent --show-error \
              --header "Authorization: Bearer ${access_token}" \
              "${service_endpoint}")"
            if [[ "$(jq -cS '.labels // {}' <<<"${after_v2}")" == \
              "$(jq -cS . <<<"${expected_labels}")" ]]; then
              break
            fi
            if [[ ${attempt} -eq 60 ]]; then
              echo "::error::Staging release labels did not converge after metadata PATCH."
              exit 1
            fi
            sleep 1
          done
          access_token=

          service_json="$(gcloud run services describe "${STAGING_SERVICE}" \
            --project "${GCP_PROJECT_ID}" \
            --region "${GCP_REGION}" \
            --format=json)"
          [[ "$(jq -r '.metadata.labels["commit-sha"]' <<<"${service_json}")" == "${COMMIT_SHA}" ]]
          [[ "$(jq -r '.metadata.labels["release-sha"]' <<<"${service_json}")" == "${COMMIT_SHA}" ]]
          [[ "$(jq -r '.latestCreatedRevision' <<<"${after_v2}")" == "${before_latest_created}" ]]
          [[ "$(jq -cS '.status.traffic' <<<"${service_json}")" == "${before_traffic}" ]]
          [[ "$(jq '[.status.traffic[] | select(.percent == 100 and .revisionName != null)] | length' \
            <<<"${service_json}")" == "1" ]]
          [[ "$(jq -r '.status.traffic[] | select(.percent == 100 and .revisionName != null) | .revisionName' \
            <<<"${service_json}")" == "${{ steps.staging.outputs.revision }}" ]]
          deployed_digest_uri="$(gcloud run revisions describe "${{ steps.staging.outputs.revision }}" \
            --project "${GCP_PROJECT_ID}" \
            --region "${GCP_REGION}" \
            --format='value(spec.containers[0].image)')"
          [[ "${deployed_digest_uri}" == "${{ steps.staging.outputs.digest_uri }}" ]]

      - name: Restore staging release after failure
        if: ${{ failure() && steps.rollback_baseline.outputs.revision != '' }}
        shell: bash
        env:
          PREVIOUS_REVISION: ${{ steps.rollback_baseline.outputs.revision }}
          PREVIOUS_LABELS: ${{ steps.rollback_baseline.outputs.labels }}
        run: |
          set -uo pipefail
          rollback_failed=0

          if current_json="$(gcloud run services describe "${STAGING_SERVICE}" \
            --project "${GCP_PROJECT_ID}" \
            --region "${GCP_REGION}" \
            --format=json)"; then
            current_count="$(jq \
              '[.status.traffic[] | select(.percent == 100 and .revisionName != null)] | length' \
              <<<"${current_json}")"
            current_revision="$(jq -r \
              '.status.traffic[] | select(.percent == 100 and .revisionName != null) | .revisionName' \
              <<<"${current_json}")"
            if [[ "${current_count}" != "1" || "${current_revision}" != "${PREVIOUS_REVISION}" ]]; then
              if ! gcloud run services update-traffic "${STAGING_SERVICE}" \
                --project "${GCP_PROJECT_ID}" \
                --region "${GCP_REGION}" \
                --to-revisions "${PREVIOUS_REVISION}=100" \
                --quiet; then
                echo "::error::Automatic staging rollback failed to restore ${PREVIOUS_REVISION}."
                rollback_failed=1
              fi
            fi
          else
            echo "::error::Automatic staging rollback could not inspect service traffic."
            rollback_failed=1
          fi

          if ! gcloud run services update-traffic "${STAGING_SERVICE}" \
            --project "${GCP_PROJECT_ID}" \
            --region "${GCP_REGION}" \
            --clear-tags \
            --quiet; then
            echo "::error::Automatic staging rollback failed to clear candidate tags."
            rollback_failed=1
          fi

          if restored_json="$(gcloud run services describe "${STAGING_SERVICE}" \
            --project "${GCP_PROJECT_ID}" \
            --region "${GCP_REGION}" \
            --format=json)"; then
            restored_count="$(jq \
              '[.status.traffic[] | select(.percent == 100 and .revisionName != null)] | length' \
              <<<"${restored_json}")"
            restored_revision="$(jq -r \
              '.status.traffic[] | select(.percent == 100 and .revisionName != null) | .revisionName' \
              <<<"${restored_json}")"
            if [[ "${restored_count}" != "1" || "${restored_revision}" != "${PREVIOUS_REVISION}" ]]; then
              echo "::error::The staging service traffic did not converge during rollback."
              rollback_failed=1
            fi
            if [[ "$(jq '[.status.traffic[] | select(.tag != null)] | length' \
              <<<"${restored_json}")" != "0" ]]; then
              echo "::error::The staging candidate tag remained after rollback."
              rollback_failed=1
            fi
          else
            rollback_failed=1
          fi

          service_name="projects/${GCP_PROJECT_ID}/locations/${GCP_REGION}/services/${STAGING_SERVICE}"
          service_endpoint="https://run.googleapis.com/v2/${service_name}"
          if access_token="$(gcloud auth print-access-token)" && \
            current="$(curl --fail --silent --show-error \
              --header "Authorization: Bearer ${access_token}" \
              "${service_endpoint}")" && \
            request_body="$(jq -cn \
              --arg name "${service_name}" \
              --arg etag "$(jq -er '.etag' <<<"${current}")" \
              --argjson labels "${PREVIOUS_LABELS}" \
              '{name: $name, etag: $etag, labels: $labels}')" && \
            curl --fail --silent --show-error \
              --request PATCH \
              --header "Authorization: Bearer ${access_token}" \
              --header "Content-Type: application/json" \
              --data-binary "${request_body}" \
              "${service_endpoint}?updateMask=labels&forceNewRevision=false" >/dev/null; then
            labels_restored=0
            for attempt in {1..60}; do
              if current="$(curl --fail --silent --show-error \
                --header "Authorization: Bearer ${access_token}" \
                "${service_endpoint}")" && \
                [[ "$(jq -cS '.labels // {}' <<<"${current}")" == \
                  "$(jq -cS . <<<"${PREVIOUS_LABELS}")" ]]; then
                labels_restored=1
                break
              fi
              sleep 1
            done
            if [[ ${labels_restored} -ne 1 ]]; then
              echo "::error::The staging service labels did not converge during rollback."
              rollback_failed=1
            fi
          else
            echo "::error::Automatic staging rollback failed to restore the prior service labels."
            rollback_failed=1
          fi
          access_token=

          if [[ ${rollback_failed} -ne 0 ]]; then
            exit 1
          fi
