# Generated by personal_brand_workspace workflow renderer v2.
# Source template SHA-256: 670ebf84c2a5b20b7fc93a046f78001f396b955cee1bd229e1bbd1f1f6757ec5
name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: pgvector/pgvector:pg17@sha256:d2ef61f42ef767baa5a1475393303cc235bcd92febd9d7014eddb48b41f3bad0
        env:
          POSTGRES_DB: portfolio_test
          POSTGRES_PASSWORD: ${{ format('{0}-{1}', github.run_id, github.run_attempt) }}
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d portfolio_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: ${{ format('postgresql://postgres:{0}-{1}@127.0.0.1:5432/portfolio_test', github.run_id, github.run_attempt) }}
      TEST_DATABASE_URL: ${{ format('postgresql://postgres:{0}-{1}@127.0.0.1:5432/portfolio_test', github.run_id, github.run_attempt) }}

    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix infra/cloudflare/portfolio-edge ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run check

      - name: Enforce backend coverage
        run: npm run test:coverage

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Enforce client coverage
        run: npm run test:client-coverage

      - name: Apply migrations to ephemeral Postgres
        run: |
          npm run db:test:provision
          npm run db:migrate

      - name: Run backend integration tests
        run: npm run test:backend-integration

      - name: Run UI tests
        run: npm run test:ui

      - name: Test Portfolio edge
        run: |
          npm --prefix infra/cloudflare/portfolio-edge run test:coverage
          npm --prefix infra/cloudflare/portfolio-edge run check

      - name: Build application
        run: npm run build

      - name: Build production image
        run: docker build --pull --tag portfolio-ci:${{ github.sha }} .

      - name: Report High vulnerabilities and misconfiguration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: portfolio-ci:${{ github.sha }}
          scanners: vuln,misconfig
          severity: HIGH
          format: table
          exit-code: "0"

      - name: Block Critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: portfolio-ci:${{ github.sha }}
          scanners: vuln
          severity: CRITICAL
          format: table
          exit-code: "1"
          skip-setup-trivy: true
      - name: Block detected secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: portfolio-ci:${{ github.sha }}
          scanners: secret
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          format: table
          exit-code: "1"
          skip-setup-trivy: true
