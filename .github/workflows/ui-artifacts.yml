name: UI Artifacts

# Generates viewport screenshots and uploads them as a build artifact.

on:
  pull_request:
  push:
    branches:
      - main
      - prod
  workflow_dispatch:

jobs:
  artifacts:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      E2E_DATA_MODE: hybrid

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Validate UI artifact environment
        run: |
          test -n "$DATABASE_URL"
          test -n "$SESSION_SECRET"
          test -n "$GOOGLE_CLIENT_ID"
          test -n "$GOOGLE_CLIENT_SECRET"

      - name: Generate viewport screenshots
        run: npm run test:pictures

      - name: Verify viewport screenshots
        run: npm run test:pictures:verify

      - name: Upload viewport screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-artifacts
          path: |
            src/tests/ui-artifacts/desktop
            src/tests/ui-artifacts/mobile
          if-no-files-found: warn
