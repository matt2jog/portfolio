# Generated by personal_brand_workspace workflow renderer v2.
# Source template SHA-256: d0908a36a26c07daabc530397782aca5178673511aa0e4c93cb98241eac1b13f
name: Stage Legacy Portfolio Data

on:
  workflow_dispatch:
    inputs:
      image_digest:
        description: Exact accepted Portfolio image URI with sha256 digest
        required: true
        type: string
      migration_mode:
        description: Stage once, then finalize only after Resume/Admin authority gates
        required: true
        type: choice
        options: [stage, finalize]
      confirmation:
        description: Enter STAGE_RETAIN_SOURCE or FINALIZE_PRIVATE_AUTHORITY
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: portfolio-data-migration
  cancel-in-progress: false

env:
  NODE_ENV: production
  GCP_PROJECT_ID: personal-brand-501801
  GCP_REGION: us-east4
  DATA_MIGRATION_SECRET_NAME: portfolio-data-migration-bundle-prod
  DATA_MIGRATION_BUNDLE_VERSION: ${{ vars.PORTFOLIO_DATA_MIGRATION_BUNDLE_VERSION }}
  ACCEPTED_IMAGE_DIGEST: ${{ vars.PORTFOLIO_DATA_MIGRATION_IMAGE_DIGEST }}
  WIF_PROVIDER: projects/601853536613/locations/global/workloadIdentityPools/personal-brand-github/providers/portfolio-data-migration-main
  DATA_MIGRATION_SERVICE_ACCOUNT: portfolio-data-migration@personal-brand-501801.iam.gserviceaccount.com
  IMAGE_DIGEST: ${{ inputs.image_digest }}
  CONFIRMATION: ${{ inputs.confirmation }}
  MIGRATION_MODE: ${{ inputs.migration_mode }}
  ADMIN_CUTOVER_EVIDENCE_URL: ${{ vars.PORTFOLIO_ADMIN_CUTOVER_EVIDENCE_URL }}
  ADMIN_CUTOVER_EVIDENCE_OIDC_AUDIENCE: ${{ vars.PORTFOLIO_ADMIN_CUTOVER_EVIDENCE_OIDC_AUDIENCE }}
  GITHUB_WORKFLOW_SHA: ${{ github.sha }}

jobs:
  legal_audit:
    if: github.repository == 'matt2jog/portfolio' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/legal-audit.yml
    with:
      source_sha: ${{ github.sha }}
      identity_mode: data_migration

  stage:
    needs: legal_audit
    if: github.repository == 'matt2jog/portfolio' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    steps:
      - name: Check out accepted source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked tooling
        run: npm ci --include=dev

      - name: Validate explicit staging request
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$MIGRATION_MODE" == "stage" ]]; then
            [[ "$CONFIRMATION" == "STAGE_RETAIN_SOURCE" ]]
          else
            [[ "$MIGRATION_MODE" == "finalize" ]]
            [[ "$CONFIRMATION" == "FINALIZE_PRIVATE_AUTHORITY" ]]
            [[ "$ADMIN_CUTOVER_EVIDENCE_URL" == "https://admin.2jog.dev/internal/portfolio-cutover-evidence" ]]
            [[ "$ADMIN_CUTOVER_EVIDENCE_OIDC_AUDIENCE" =~ ^https://[a-z0-9-]+-[a-z0-9-]+\.us-east4\.run\.app/?$ ]]
          fi
          [[ "$DATA_MIGRATION_BUNDLE_VERSION" =~ ^[1-9][0-9]*$ ]]
          [[ "$IMAGE_DIGEST" =~ ^us-east4-docker\.pkg\.dev/personal-brand-501801/portfolio/portfolio@sha256:[0-9a-f]{64}$ ]]
          [[ "$ACCEPTED_IMAGE_DIGEST" == "$IMAGE_DIGEST" ]]

      - name: Authenticate through workflow-bound WIF
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DATA_MIGRATION_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Authorize digest pull
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Pull and prove current-SHA service-owned image provenance
        run: |
          set -euo pipefail
          docker pull "$IMAGE_DIGEST"
          npx tsx src/scripts/release/image-provenance.ts "$IMAGE_DIGEST" "$GITHUB_SHA"

      - name: Stage and reconcile legacy data
        id: migrate
        env:
          PORTFOLIO_DATA_MIGRATION_MODE: ${{ inputs.migration_mode == 'finalize' && 'finalize' || 'bootstrap' }}
        shell: bash
        run: |
          set -euo pipefail
          bundle_file="${RUNNER_TEMP}/portfolio-data-migration-bundle.json"
          evidence_file="${RUNNER_TEMP}/portfolio-data-migration-evidence.json"
          admin_request_file="${RUNNER_TEMP}/portfolio-admin-cutover-request.json"
          admin_jws_file="${RUNNER_TEMP}/portfolio-admin-cutover-evidence.jws"
          install -m 600 /dev/null "$bundle_file"
          gcloud secrets versions access "$DATA_MIGRATION_BUNDLE_VERSION" --secret "$DATA_MIGRATION_SECRET_NAME" --project "$GCP_PROJECT_ID" > "$bundle_file"
          if [[ "$MIGRATION_MODE" == "finalize" ]]; then
            migration_ledger_digest="$(npx tsx src/scripts/release/migration-plan-digest.ts src/migrations)"
            npx tsx src/scripts/release/admin-cutover-request.ts \
              "$GITHUB_SHA" "${IMAGE_DIGEST##*@}" "$migration_ledger_digest" > "$admin_request_file"
            oidc_token="$(gcloud auth print-identity-token --audiences="$ADMIN_CUTOVER_EVIDENCE_OIDC_AUDIENCE" --include-email)"
            curl --fail-with-body --silent --show-error \
              --request POST \
              --header "Authorization: Bearer ${oidc_token}" \
              --header "Content-Type: application/json" \
              --data-binary "@${admin_request_file}" \
              --output "$admin_jws_file" \
              "$ADMIN_CUTOVER_EVIDENCE_URL"
            unset oidc_token
            admin_jws="$(tr -d '\r\n' < "$admin_jws_file")"
            [[ "$admin_jws" =~ ^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$ ]]
            PORTFOLIO_ADMIN_CUTOVER_EVIDENCE_JWS="$admin_jws" \
              npx tsx src/scripts/release/run-data-migration-from-bundle.ts "$bundle_file" "$IMAGE_DIGEST" > "$evidence_file"
            unset admin_jws
          else
            npx tsx src/scripts/release/run-data-migration-from-bundle.ts "$bundle_file" "$IMAGE_DIGEST" > "$evidence_file"
          fi
          node - "$evidence_file" "$MIGRATION_MODE" <<'NODE'
          const evidence = JSON.parse(require("node:fs").readFileSync(process.argv[2], "utf8"));
          const mode = process.argv[3];
          if (mode === "stage" && (evidence.status !== "staged" || evidence.cutoverReady !== false)) {
            throw new Error("Portfolio staging evidence is incomplete");
          }
          if (mode === "finalize" && (evidence.status !== "finalized" || evidence.cutoverReady !== true || evidence.eventSilent !== true)) {
            throw new Error("Portfolio final cutover evidence is incomplete");
          }
          if (evidence.sourceRetained !== true || !Array.isArray(evidence.tables) || evidence.tables.length !== 23) {
            throw new Error("Portfolio staging evidence does not cover the reviewed table manifest");
          }
          NODE
          evidence_sha256="$(node - "$evidence_file" <<'NODE'
          const { createHash } = require("node:crypto");
          const value = JSON.parse(require("node:fs").readFileSync(process.argv[2], "utf8"));
          const sort = (v) => Array.isArray(v) ? v.map(sort) : v && typeof v === "object" ? Object.fromEntries(Object.keys(v).sort().map((k) => [k, sort(v[k])])) : v;
          process.stdout.write(createHash("sha256").update(JSON.stringify(sort(value))).digest("hex"));
          NODE
          )"
          echo "evidence_sha256=${evidence_sha256}" >> "$GITHUB_OUTPUT"

      - name: Upload count and hash evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: portfolio-data-migration-evidence-${{ github.run_id }}-${{ github.run_attempt }}-${{ steps.migrate.outputs.evidence_sha256 }}
          path: ${{ runner.temp }}/portfolio-data-migration-evidence.json
          if-no-files-found: error
          retention-days: 30

      - name: Remove ephemeral migration material
        if: always()
        run: rm -f "${RUNNER_TEMP}/portfolio-data-migration-bundle.json" "${RUNNER_TEMP}/portfolio-data-migration-evidence.json" "${RUNNER_TEMP}/portfolio-admin-cutover-request.json" "${RUNNER_TEMP}/portfolio-admin-cutover-evidence.jws"
