name: Legal Audit

on:
  push:
    branches: [main]
    paths:
      - legal/**.md
      - src/scripts/legal/**
      - .github/workflows/legal-audit.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: personal-brand-501801
  LEGAL_AUDIT_SECRET_NAME: portfolio-legal-audit-bundle-prod
  LEGAL_AUDIT_BUNDLE_VERSION: ${{ vars.PORTFOLIO_LEGAL_AUDIT_BUNDLE_VERSION }}
  WIF_PROVIDER: projects/601853536613/locations/global/workloadIdentityPools/personal-brand-github/providers/portfolio-legal-audit-main
  DEPLOY_SERVICE_ACCOUNT: portfolio-legal-audit@personal-brand-501801.iam.gserviceaccount.com

jobs:
  record:
    if: github.repository == 'matt2jog/portfolio' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out legal source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Authenticate through repository-bound WIF
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Resolve source commit timestamp
        id: commit
        shell: bash
        run: echo "committed_at=$(git show -s --format=%cI "$GITHUB_SHA")" >> "$GITHUB_OUTPUT"

      - name: Record immutable legal versions
        env:
          GIT_COMMITTED_AT: ${{ steps.commit.outputs.committed_at }}
        run: |
          set -euo pipefail
          [[ "$LEGAL_AUDIT_BUNDLE_VERSION" =~ ^[1-9][0-9]*$ ]]
          bundle_file="${RUNNER_TEMP}/portfolio-legal-audit-bundle.json"
          gcloud secrets versions access "$LEGAL_AUDIT_BUNDLE_VERSION" --secret "$LEGAL_AUDIT_SECRET_NAME" --project "$GCP_PROJECT_ID" > "$bundle_file"
          npm run legal:record:bundle -- "$bundle_file"

      - name: Remove ephemeral legal-audit bundle
        if: always()
        run: rm -f "${RUNNER_TEMP}/portfolio-legal-audit-bundle.json"
