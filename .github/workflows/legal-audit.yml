name: Legal Audit

on:
  workflow_call:
    inputs:
      source_sha:
        description: Exact caller commit to audit
        required: true
        type: string
      identity_mode:
        description: Select the reusable caller-bound WIF provider
        required: true
        type: string
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact current main commit to audit
        required: true
        type: string
      identity_mode:
        description: Direct dispatches must use dispatch
        required: true
        default: dispatch
        type: choice
        options: [dispatch]

permissions:
  contents: read
  id-token: write

env:
  NODE_ENV: production
  GCP_PROJECT_ID: personal-brand-501801
  LEGAL_AUDIT_SECRET_NAME: portfolio-legal-audit-bundle-prod
  LEGAL_AUDIT_BUNDLE_VERSION: ${{ vars.PORTFOLIO_LEGAL_AUDIT_BUNDLE_VERSION }}
  WIF_PROVIDER: ${{ inputs.identity_mode == 'reusable' && 'projects/601853536613/locations/global/workloadIdentityPools/personal-brand-github/providers/portfolio-legal-reusable-main' || inputs.identity_mode == 'data_migration' && 'projects/601853536613/locations/global/workloadIdentityPools/personal-brand-github/providers/portfolio-legal-migrate-main' || inputs.identity_mode == 'release_cleanup' && 'projects/601853536613/locations/global/workloadIdentityPools/personal-brand-github/providers/portfolio-legal-cleanup-main' || 'projects/601853536613/locations/global/workloadIdentityPools/personal-brand-github/providers/portfolio-legal-audit-main' }}
  DEPLOY_SERVICE_ACCOUNT: portfolio-legal-audit@personal-brand-501801.iam.gserviceaccount.com
  LEGAL_AUDIT_WORKFLOW_REF: matt2jog/portfolio/.github/workflows/legal-audit.yml@refs/heads/main

jobs:
  record:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      IDENTITY_MODE: ${{ inputs.identity_mode }}
    steps:
      - name: Check out legal source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact caller commit
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "matt2jog/portfolio"
          test "$GITHUB_REF" = "refs/heads/main"
          case "$IDENTITY_MODE" in
            reusable)
              test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
              ;;
            data_migration|release_cleanup|dispatch)
              test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
              ;;
            *)
              echo "Unsupported legal-audit identity mode." >&2
              exit 1
              ;;
          esac
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$SOURCE_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Authenticate through repository-bound WIF
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Resolve source commit timestamp
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          committed_at="$(git show -s --format=%cI "$SOURCE_SHA")"
          echo "committed_at=${committed_at}" >> "$GITHUB_OUTPUT"

      - name: Record immutable legal versions
        env:
          GIT_COMMITTED_AT: ${{ steps.commit.outputs.committed_at }}
        run: |
          set -euo pipefail
          [[ "$LEGAL_AUDIT_BUNDLE_VERSION" =~ ^[1-9][0-9]*$ ]]
          bundle_file="${RUNNER_TEMP}/portfolio-legal-audit-bundle.json"
          install -m 600 /dev/null "$bundle_file"
          gcloud secrets versions access "$LEGAL_AUDIT_BUNDLE_VERSION" --secret "$LEGAL_AUDIT_SECRET_NAME" --project "$GCP_PROJECT_ID" > "$bundle_file"
          env GITHUB_SHA="$SOURCE_SHA" GITHUB_WORKFLOW_SHA="$SOURCE_SHA" GITHUB_WORKFLOW_REF="$LEGAL_AUDIT_WORKFLOW_REF" npm run legal:record:bundle -- "$bundle_file"

      - name: Remove ephemeral legal-audit bundle
        if: always()
        run: rm -f "${RUNNER_TEMP}/portfolio-legal-audit-bundle.json"
