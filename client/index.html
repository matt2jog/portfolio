    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <body>
    <div id="root"></div>
    <!-- Defensive: ensure `sendError` exists early to avoid runtime throws from external overlays/extensions -->
    <script>
      (function(){
        try {
          if (typeof window.sendError !== 'function') {
            window.sendError = function(){
              try { window.__pageErrors = window.__pageErrors || []; window.__pageErrors.push({ at: Date.now(), kind: 'sendError-preinit', args: Array.from(arguments).map(a => (typeof a === 'string' ? a : (a && a.stack) || String(a))) }); } catch (e) {}
            };
          }
        } catch (e) {}
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
